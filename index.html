      decided=true;
      if(Math.abs(dy)>Math.abs(dx)){        /* 縦は画面のスクロールに譲る */
        live=false; strip.classList.remove("grabbing"); return;
      }
      /* 触っている指は要素が自動で掴んでいるので、捕捉はマウスのときだけ。
         タッチで捕捉すると環境によっては pointercancel を誘発する。 */
      if(ev.pointerType==="mouse"){ try{ strip.setPointerCapture(pid) }catch(_){} }
    }
    moved=true; dxLast=dx;
    put(x0+dx,0);
    paint(Math.round(-x/W()));
  },{signal:sig,passive:true});

  const finish=ev=>{
    if(!live) return;
    live=false;
    const w=W();
    const dx=(ev && ev.type==="pointerup" && ev.clientX!=null) ? ev.clientX-sx : dxLast;
    const v=dx/Math.max(1,Date.now()-t0);
    let step=0;
    if(moved && (Math.abs(dx)>w*.18 || Math.abs(v)>.35)) step = dx<0 ? 1 : -1;
    goTo(cur+step);
    if(moved) eatClick();
    setTimeout(()=>strip.classList.remove("grabbing"), DUR+40);
  };
  strip.addEventListener("pointerup",finish,{signal:sig,passive:true});
  strip.addEventListener("pointercancel",finish,{signal:sig,passive:true});
}



/* =========================================================
   8. render — 早見表（月ごとのミニカード）
   ========================================================= */
function tableHTML(list){
  /* 月で仕切るのは「日付で並べているとき」だけ。
     終了が近い／遠い順は終了月で、開幕が早い順は開幕月でまとめる。
     名前順・近い順は日付と関係がないので、仕切らずそのまま並べる。 */
  const GROUPED={deadline:"end", endfar:"end", start:"start"};
  const field=GROUPED[state.sort]||null;
  const byStart=field==="start";

  /* コンパクトは3列。1枚の幅が110pxほどしかなく、会場名と料金は
     どうやっても収まらないので、その2つだけ落として密度を上げる。 */
  const cp = state.tz==="3";
  const cls = cp ? " cp" : "";

  /* ミニカード1枚。常設（openEnded）もここで面倒を見る。 */
  const mini=e=>{
    const st=status(e), col=meterColor(st), x=EXTRA[e.id]||{};
    const fav=state.favs.has(e.id);
    const heart=fav?`<span class="mfav">${I.heartFill}</span>`:"";
    const sub=cp?"":`<div class="mv">${esc(e.sub)}・${e.free?"無料":esc(x.pl||"有料")}</div>`;
    if(e.openEnded){
      return `<button class="mini${cls} ${fav?"faved":""}" style="--ac:${col}" data-jump="${e.id}">${heart}
        <div class="md">常設</div>
        <div class="mt">${esc(e.altTitle||e.title)}</div>
        ${sub}
        <div class="ml">いつでも</div></button>`;
    }
    const d=pd(byStart?e.start:e.end), wd=d.getDay(), wecls=wd===0?"su":wd===6?"sa":"";
    /* 波線は「その日まで」の意味。開幕日を出しているときは後ろに回して
       「その日から」に読み替える。 */
    const date=byStart
      ? `${d.getMonth()+1}/${d.getDate()}<small class="${wecls}">${WD[wd]}</small><span class="mtil post">〜</span>`
      : `<span class="mtil">〜</span>${d.getMonth()+1}/${d.getDate()}<small class="${wecls}">${WD[wd]}</small>`;
    const left = st.k==="pre" ? (st.days===1 ? (e.preTomorrow||"明日開幕") : `開幕まで${st.days}日`)
               : st.k==="end" ? (e.endedShort||"終了")
               : st.days===1 ? (e.nowTomorrow||"明日まで")
               : `${e.nowShort||"のこり"}${st.days}日`;
    return `<button class="mini${cls} ${st.k==="end"?"ended":""} ${fav?"faved":""}" style="--ac:${col}" data-jump="${e.id}">${heart}
      <div class="md">${date}</div>
      <div class="mt">${esc(e.altTitle||e.title)}</div>
      ${sub}
      <div class="ml">${left}</div>
    </button>`;
  };

  /* 説明とボタンは会期表と同じ並び（左に説明、右に切り替え） */
  const top = `<div class="gtop">
      <p class="gcap">日付は<b>会期の${byStart?"初日":"最終日"}</b>。カードをタップすると、その展覧会が開きます。</p>
      <div class="gzoom">
        <button data-tz="2" aria-pressed="${!cp}">標準</button>
        <button data-tz="3" aria-pressed="${cp}">コンパクト</button>
      </div>
    </div>`;
  const grid = items => `<div class="mgrid${cp?" c3":""}">${items.map(mini).join("")}</div>`;

  if(!field){
    return top + `<section class="mgroup" style="--g:0">${grid(list)}</section>`;
  }

  const groups=new Map(), perm=[];
  list.forEach(e=>{
    if(e.openEnded){ perm.push(e); return; }
    const d=pd(e[field]), key=`${d.getFullYear()}-${d.getMonth()}`;
    if(!groups.has(key)) groups.set(key,{y:d.getFullYear(),m:d.getMonth(),items:[]});
    groups.get(key).items.push(e);
  });
  /* 見出しの並びは本文の並びに合わせる。終了が遠い順のときだけ新しい月が上 */
  const dir = state.sort==="endfar" ? -1 : 1;
  const keys=[...groups.values()].sort((a,b)=>dir*((a.y-b.y)||(a.m-b.m)));
  /* 今年以外の月は「1月」だけだと別の年と見分けがつかないので、年を添える */
  const thisY=today.getFullYear();

  let html = keys.map((g,gi)=>`<section class="mgroup" style="--g:${gi}">
      <div class="mhead"><h3>${g.y!==thisY?`<span class="my">${g.y}</span>`:""}${g.m+1}<span class="mu">月</span></h3><span class="ln"></span><span class="ct">${g.items.length}件</span></div>
      ${grid(g.items)}
    </section>`).join("");

  if(perm.length) html += `<section class="mgroup" style="--g:${keys.length}">
      <div class="mhead"><h3>通年</h3><span class="ln"></span><span class="ct">${perm.length}件</span></div>
      ${grid(perm)}</section>`;

  return top + html;
}

/* =========================================================
   9. render — 会期表（全体 / 日ごと）
   ========================================================= */
function ganttHTML(list, quiet){
  /* 横軸は「去年の1月」から。常設展の開館日まで遡ると尺が伸びすぎて、
     肝心のこれからの会期が潰れて読めなくなるため。 */
  const FLOOR=new Date(today.getFullYear()-1,0,1);
  /* 並び順は filtered() が決めたものをそのまま使う。
     ここで開幕日で並べ直していたせいで、「名前順」などに切り替えても
     会期表だけ並びが変わらなかった。 */
  let items=list.filter(e=>!e.openEnded).slice();
  const inWin=items.filter(e=>pd(e.end)>=FLOOR);
  if(inWin.length) items=inWin;
  if(!items.length) return `<p class="empty">表示できる会期がありません。</p>`;

  let min=null,max=null;
  items.forEach(e=>{const s=pd(e.start),en=pd(e.end);if(!min||s<min)min=s;if(!max||en>max)max=en});
  if(min<FLOOR) min=FLOOR;
  const T0=new Date(min.getFullYear(),min.getMonth(),1);
  const TE=new Date(max.getFullYear(),max.getMonth()+1,0);
  const N=diff(T0,TE)+1;
  const day=state.gz==="day";

  const LW = day?134:126;
  const avail=(document.querySelector(".wrap")?document.querySelector(".wrap").clientWidth:360)+28;
  const cw = day ? 17 : Math.max(1.6,(Math.min(avail,758)-LW-4)/N);
  const PW = cw*N;
  const idx = d=>diff(T0,d);
  const nowIn = idx(today)>=0 && idx(today)<N, nowX=idx(today)*cw;

  /* 背景：週末の縞・月境 */
  let back="";
  for(let i=0;i<N;i++){
    const d=new Date(+T0+i*MS), w=d.getDay();
    if(day){ if(w===0||w===6) back+=`<div class="wk" style="left:${i*cw}px;width:${cw}px"></div>` }
    else if(w===6) back+=`<div class="wk" style="left:${i*cw}px;width:${cw*2}px"></div>`;
    if(w===1&&i>0) back+=`<div class="dv" style="left:${i*cw}px"></div>`;
    if(d.getDate()===1&&i>0) back+=`<div class="mo" style="left:${i*cw}px"></div>`;
  }

  /* ヘッダー：月ラベル（＋日ごとなら日付） */
  let hh="";
  let c=new Date(T0);
  while(c<=TE){
    const s0=Math.max(0,idx(c));
    const e0=Math.min(N-1,idx(new Date(c.getFullYear(),c.getMonth()+1,0)));
    if(e0>=s0) hh+=`<div class="gmo" style="left:${s0*cw}px;width:${(e0-s0+1)*cw}px">${c.getMonth()===0||c.getTime()===T0.getTime()?c.getFullYear()+".":""}${c.getMonth()+1}月</div>`;
    c=new Date(c.getFullYear(),c.getMonth()+1,1);
  }
  if(day){
    for(let i=0;i<N;i++){
      const d=new Date(+T0+i*MS), w=d.getDay();
      hh+=`<div class="gdy${w===0?" su":w===6?" sa":""}" style="left:${i*cw}px;width:${cw}px">${d.getDate()}</div>`;
    }
  }

  const rows=items.map((e,i)=>{
    const s=pd(e.start),en=pd(e.end),st=status(e),col=meterColor(st);
    const s0=Math.max(0,idx(s)), e0=Math.min(N-1,idx(en));
    const bx=s0*cw, bw=Math.max(3,(e0-s0+1)*cw-1);
    const clipL=idx(s)<0;
    const done=st.k==="end"?100:st.k==="pre"?0:Math.round(progress(e)*100);
    const fav=state.favs.has(e.id)?`<i class="gfav">${I.heartFill}</i>`:"";
    return `<div class="grow ${st.k==="end"?"past":""}" style="--i:${Math.min(i,14)}">
      <button class="glabel" style="flex-basis:${LW}px;width:${LW}px" data-jump="${e.id}">
        <span class="gn">${fav}${esc(e.altTitle||e.title)}</span>
        <span class="gd">${s.getMonth()+1}/${s.getDate()}〜${en.getMonth()+1}/${en.getDate()}</span>
      </button>
      <div class="gplot" style="width:${PW}px">
        <div class="gbar${clipL?" clipL":""}" style="left:${bx}px;width:${bw}px;background:${col};animation-delay:${Math.min(i,14)*45}ms">${done>0?`<u style="width:${done}%"></u>`:""}</div>
      </div>
    </div>`;
  }).join("");

  return `<div class="gtop">
      <p class="gcap">赤い縦線が<b>今日（${today.getMonth()+1}/${today.getDate()}）</b>。左の展覧会名をタップすると、その展覧会が開きます。</p>
      <div class="gzoom">
        <button data-gz="fit" aria-pressed="${!day}">全体</button>
        <button data-gz="day" aria-pressed="${day}">日ごと</button>
      </div>
    </div>
    <div class="gwrap${quiet?" quiet":""}" id="gscroll"><div class="ginner" style="width:${LW+PW}px">
      <div class="gback" style="left:${LW}px;width:${PW}px">${back}</div>
      ${nowIn?`<div class="gnowline" style="left:${LW+nowX}px"></div>`:""}
      <div class="grow ghead">
        <div class="glabel" style="flex-basis:${LW}px;width:${LW}px">展覧会</div>
        <div class="gplot" style="width:${PW}px;height:${day?37:21}px">${hh}</div>
      </div>
      ${rows}
    </div></div>
    <p class="gleg">バーの薄い部分が経過ぶん、濃い部分がこれから残っている会期です。${day?"左右にスクロールできます。":"「日ごと」に切り替えると日付の目盛りが出ます。"}</p>`;
}

/* =========================================================
   10. アーティスト画面
   ========================================================= */
/* SNS・公式サイト。確認できたものだけ実リンク、無い作家は検索に逃がす。 */
const SNS_ICON={ig:"ig",x:"xsns",site:"ext"};
/* まだ登録していない先の「探す」URL。X はアカウント検索、
   それ以外は検索エンジンに投げる。 */
const SNS_META={
  site:{name:"公式HP",             icon:"ext",  find:q=>`https://www.google.com/search?q=${q}+%E5%85%AC%E5%BC%8F%E3%82%B5%E3%82%A4%E3%83%88`},
  x:   {name:"Xアカウント",         icon:"xsns", find:q=>`https://x.com/search?q=${q}&f=user`},
  ig:  {name:"Instagramアカウント",  icon:"ig",   find:q=>`https://www.google.com/search?q=${q}+instagram`},
};

/* アーティストのSNS。丸の中にアイコンだけを並べる。
   登録済みは色付きでその先へ、未登録は灰色のまま検索結果へ飛ぶ。 */
function snsHTML(a){
  const q=encodeURIComponent(a.en?`${a.name} ${a.en}`:a.name);
  const has=k=>(a.sns||[]).find(v=>v.k===k) || (k==="site"&&a.site?{u:a.site}:null);
  /* 先頭は Wikipedia。ボタンの形は今までのピル型のまま、この列の一番左に置く。 */
  const wiki=`<a class="lb ghost" href="https://ja.wikipedia.org/w/index.php?search=${q}"
      target="_blank" rel="noopener">${I.wiki}Wikipedia</a>`;
  return `<div class="snsdots">` + wiki + ["site","x","ig"].map(k=>{
    const m=SNS_META[k], icon=I[m.icon], hit=has(k);
    if(hit) return `<a class="sd" href="${hit.u}" target="_blank" rel="noopener" aria-label="${m.name}">${icon}</a>`;
    /* 未登録は灰色のまま、押すと検索結果へ */
    return `<a class="sd off" href="${m.find(q)}" target="_blank" rel="noopener"
      aria-label="${m.name}を検索する">${icon}</a>`;
  }).join("") + `</div>`;
}
function artistBlock(a,base){
  const q=encodeURIComponent(a.en?`${a.name} ${a.en}`:a.name);
  const works=a.works.map((w,i)=>{
    const wq=encodeURIComponent(`${a.en||a.name} ${w.t}`);
    return `<div class="work" style="--i:${base+5+i}">
      <div class="wt"><b>${esc(w.t)}</b><small>${esc(w.y)}</small></div>
      <a class="imgbtn" href="https://www.google.com/search?tbm=isch&q=${wq}" target="_blank" rel="noopener">${I.img}画像</a></div>`;
  }).join("");
  return `<h2 class="aname" style="--i:${base}">${esc(a.name)}<small>${esc(a.en||"")}</small></h2>
    <div class="ameta" style="--i:${base+1}">${a.meta.map(m=>`<span>${esc(m)}</span>`).join("")}</div>
    <p class="abio" style="--i:${base+2}">${esc(a.bio)}</p>
    <div class="linkbtns" style="--i:${base+3}">
      <a class="lb" href="https://www.google.com/search?tbm=isch&q=${q}" target="_blank" rel="noopener">${I.img}作品を画像で見る</a>
    </div>
    <div style="--i:${base+3}">${snsHTML(a)}</div>
    <h3 class="h3" style="--i:${base+4}">代表作</h3>${works}`;
}
function openArtist(k1,k2){
  const a1=ARTISTS[k1]; if(!a1) return;
  const a2=k2?ARTISTS[k2]:null;
  document.getElementById("sheetBody").innerHTML=
    artistBlock(a1,0)+(a2?`<div style="height:34px"></div>`+artistBlock(a2,7):"")+
    `<p class="disclaim" style="--i:14">「画像」ボタンは Google 画像検索の結果を新しいタブで開きます。現代作家の作品は著作権が生きているため、このページ内に画像を直接埋め込むことはしていません。</p>`;
  const sh=document.getElementById("sheet");
  document.getElementById("sheetScroll").scrollTop=0;
  document.getElementById("sheetBack").classList.add("on");
  requestAnimationFrame(()=>{sh.classList.add("on");sh.setAttribute("aria-hidden","false")});
  document.body.style.overflow="hidden";
}
function closeArtist(){
  const sh=document.getElementById("sheet");
  if(!sh.classList.contains("on")) return;
  sh.classList.remove("on"); sh.setAttribute("aria-hidden","true");
  document.getElementById("sheetBack").classList.remove("on");
  document.body.style.overflow="";
}

/* =========================================================
   11. main render
   ========================================================= */
const FEE_TXT={all:"すべて",free:"無料",paid:"有料",open:"開催中のみ",today:"今日行ける"};
const SORT_TXT={deadline:"終了が近い順",endfar:"終了が遠い順",near:"近い順",start:"開幕が早い順",name:"名前順"};
const VIEW_TXT={cards:"カード",table:"早見表",gantt:"会期表"};

const poolSize = () => state.shared ? state.shared.size : EX.length;

/* 共有リンクで開いているときだけ、上に帯を出す */
function syncShareBar(){
  const bar=document.getElementById("shareBar");
  if(!bar) return;
  bar.classList.toggle("on",!!state.shared);
  if(!state.shared) return;
  const n=state.shared.size;
  const view=state.shareMode==="view";
  bar.classList.toggle("viewonly",view);
  document.getElementById("shareTitle").textContent=view?"共有された展覧会":"共有されたマイリスト";
  document.getElementById("shareExit").textContent=view?"すべての展覧会を見る":"自分のリストに戻る";
  if(view){
    document.getElementById("shareNote").textContent="この1件だけを表示しています。";
    return;
  }
  const mine=[...state.shared].filter(id=>state.favs.has(id)).length;
  document.getElementById("shareNote").textContent=
    `${n}件のリストを表示しています。`+(mine>=n?"すべて自分のお気に入りにも入っています。":"");
  document.getElementById("shareAdopt").textContent=
    mine>=n?"反映済み":`自分のリストに反映（${n-mine}件）`;
  document.getElementById("shareAdopt").disabled=mine>=n;
}
function exitShare(){
  state.shared=null;
  history.replaceState(null,"",baseURL());
  syncShareBar(); render(); restartView();
}

function updateSummary(){
  const el=document.getElementById("filSummary"); if(!el) return;
  const n=state.lastCount;
  if(state.filtersOpen){ el.textContent=`${n} / ${poolSize()} 件`; return; }
  const p=[];
  if(state.q.trim()) p.push(`"${state.q.trim()}"`);
  if(state.fee!=="all") p.push(FEE_TXT[state.fee]);
  if(state.area!=="all") p.push(state.area);
  if(state.festOnly) p.push("フェス・芸術祭");
  if(state.favOnly) p.push("お気に入り");
  p.push(SORT_TXT[state.sort]);
  /* 中黒は字形が行の中心より上にあるので、包んで少し下げる */
  const sep='<span class="sep">·</span>';
  el.innerHTML=`${n}件 ${sep} ${p.map(esc).join(` ${sep} `)}`;
}
function setFilters(open,save){
  state.filtersOpen=open;
  document.getElementById("filToggle").setAttribute("aria-expanded",open);
  document.getElementById("filters").classList.toggle("collapsed",!open);
  updateSummary();
  if(open) requestAnimationFrame(moveTabInd);
  if(save) store.set("filtersOpen",open);
}
function moveTabInd(){
  const th=document.getElementById("viewThumb");
  if(!th) return;
  const idx=["cards","table","gantt"].indexOf(state.view);
  th.style.transform=`translateX(${idx*100}%)`;
  document.querySelectorAll("#viewSeg button").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===state.view));
}
function fail(err){
  const cv=document.getElementById("view-cards");
  if(cv) cv.innerHTML=`<p class="empty">表示エラー：${esc(String(err&&err.message||err))}</p>`;
  console.error(err);
}
function render(){ try{ render_() }catch(err){ fail(err) } }
function render_(){
  const list=filtered();
  state.lastCount=list.length; updateSummary();
  document.getElementById("countLabel").textContent=
    `${list.length} / ${poolSize()} 件`+(state.pos?"　·　現在地から所要時間を表示中":"　·　位置情報を許可すると所要時間が出ます");

  const cv=document.getElementById("view-cards");
  cv.innerHTML=list.length?list.map(cardHTML).join(""):`<p class="empty">条件に合う展示がありません。<br>キーワードやフィルターを変えてみてください。</p>`;
  document.getElementById("view-table").innerHTML=list.length?tableHTML(list):`<p class="empty">条件に合う展示がありません。</p>`;
  document.getElementById("view-gantt").innerHTML=list.length?ganttHTML(list):`<p class="empty">条件に合う展示がありません。</p>`;

  ["cards","table","gantt"].forEach(v=>document.getElementById("view-"+v).classList.toggle("on",state.view===v));
  animateMeters(cv); bindShots(cv); moveTabInd();
  if(state.view==="gantt") scrollGanttToToday();
}
function scrollGanttToToday(){
  const sc=document.getElementById("gscroll"), now=sc&&sc.querySelector(".gnowline");
  if(!sc||!now) return;
  const x=parseFloat(now.style.left)||0;
  sc.scrollLeft=Math.max(0,x-sc.clientWidth*0.42);
}
/* 会期表は display:none をはさむと横スクロールが左端（＝去年）へ戻る。
   絞り込んだ直後にこれが起きると、残ったバーが画面の右外に行ってしまい、
   「フィルターが効いていない」ように見える。出し直したら必ず今日へ寄せる。 */
function restartView(){
  const el=document.getElementById("view-"+state.view);
  el.classList.remove("on"); void el.offsetWidth; el.classList.add("on");
  if(state.view==="gantt") requestAnimationFrame(scrollGanttToToday);
}

/* =========================================================
   12. events
   ========================================================= */
document.addEventListener("click", async ev=>{
  if(ev.target.closest("a[href]")) return;
  const t=ev.target.closest("[data-menu],[data-toggle],[data-fav],[data-artist],[data-view],[data-fee],[data-theme-set],[data-gz],[data-tz],[data-jump],[data-map],[data-links]");
  if(!t) return;

  /* アーティスト解説。未登録のときは何も開かないが、ここで止める。
     素通しするとカードの開閉が代わりに反応してしまう。 */
  if(t.hasAttribute("data-artist")){
    const k=t.dataset.artist;
    if(k) openArtist(k, t.dataset.artist2||"");
    return;
  }

  if(t.dataset.menu){ openMenu(t.dataset.menu,t); return; }

  if(t.dataset.themeSet){ state.theme=t.dataset.themeSet; applyTheme(true); store.set("theme",state.theme); return; }

  if(t.dataset.gz){
    if(state.gz===t.dataset.gz) return;
    state.gz=t.dataset.gz; savePrefs();
    /* 拡大率が変わるだけで並び順は同じ。左のリストまで入り直すと
       並べ替えたように見えるので、動くのはバーだけにする。 */
    document.getElementById("view-gantt").innerHTML=ganttHTML(filtered(), true);
    scrollGanttToToday(); return;
  }
  if(t.dataset.tz){
    if(state.tz===t.dataset.tz) return;
    state.tz=t.dataset.tz; savePrefs();
    document.getElementById("view-table").innerHTML=tableHTML(filtered());
    return;
  }

  /* 早見表 → カードへジャンプ */
  if(t.dataset.jump){
    const id=t.dataset.jump;
    state.view="cards"; savePrefs();
    state.open.add(id);
    render(); restartView();
    requestAnimationFrame(()=>{
      const c=document.querySelector(`.card[data-id="${id}"]`);
      if(c) c.scrollIntoView({behavior:"smooth",block:"center"});
    });
    return;
  }

  if(t.dataset.view){
    if(state.view===t.dataset.view) return;
    state.view=t.dataset.view; savePrefs(); render(); restartView(); return;
  }
  if(t.dataset.fee){
    if(state.fee===t.dataset.fee) return;
    state.fee=t.dataset.fee;
    document.querySelectorAll("#feeChips .chip[data-fee]").forEach(b=>b.setAttribute("aria-pressed",b===t));
    savePrefs(); render(); restartView(); return;
  }
  if(t.dataset.toggle){
    const id=t.dataset.toggle;
    state.open.has(id)?state.open.delete(id):state.open.add(id);
    const card=document.querySelector(`.card[data-id="${id}"]`);
    if(card) card.classList.toggle("open",state.open.has(id));
    return;
  }
  if(t.dataset.fav){
    const id=t.dataset.fav, on=!state.favs.has(id);
    on?state.favs.add(id):state.favs.delete(id);
    t.setAttribute("aria-pressed",on);
    t.classList.remove("pop"); void t.offsetWidth; t.classList.add("pop");
    setTimeout(()=>t.classList.remove("pop"),340);
    store.set("favs",[...state.favs]);
    syncShareBar();
    if(state.favOnly) setTimeout(()=>{render();restartView()},240);
    return;
  }
  if(t.dataset.map){ openMap(t.dataset.map); return; }
  if(t.dataset.links){ openLinks(t.dataset.links); return; }
  if(t.dataset.artist){ openArtist(t.dataset.artist,t.dataset.artist2||null); return; }
});

   どちらも駄目なときだけ、選択してコピーできる形で出す。 */
async function shareLink(title,text,url){
  if(navigator.share){
    try{ await navigator.share({title,text,url}); return }
    catch(err){ if(err && err.name==="AbortError") return }
  }
  try{ await navigator.clipboard.writeText(url); toast("リンクをコピーしました"); return }
  catch(_){}
  window.prompt("このリンクをコピーしてください", url);
}

/* ===== ポップオーバー（ヘッダーの ⋯ / カードの ⋯）=====
   押したボタンの右端に右端を合わせて、その場に出す。
   下に入りきらないときだけ上へ返し、画面端は 8px 残す。 */
let menuTarget=null, menuBtn=null, menuEl=null;
function placeMenu(m,btn){
  const r=btn.getBoundingClientRect(), pad=8, gap=6;
  const w=m.offsetWidth, h=m.offsetHeight;
  const left=Math.max(pad, Math.min(r.right-w, window.innerWidth-pad-w));
  let top=r.bottom+gap, up=false;
  if(top+h>window.innerHeight-pad && r.top-gap-h>pad){ top=r.top-gap-h; up=true }
  top=Math.max(pad, Math.min(top, window.innerHeight-pad-h));
  m.style.left=left+"px";
  m.style.top=top+"px";
  m.style.transformOrigin=(up?"bottom":"top")+" right";
}
function openPop(m,btn){
  /* 同じボタンをもう一度押したら閉じるだけ */
  if(menuEl===m && menuBtn===btn){ closeMenu(); return }
  if(menuEl) closeMenu(true);
  menuEl=m; menuBtn=btn;
  m.classList.add("on");
  m.setAttribute("aria-hidden","false");
  document.getElementById("cmenuBack").classList.add("on");
  btn.classList.add("on");
  btn.setAttribute("aria-expanded","true");
  /* display を戻した直後は実寸が取れないので、置いてから 1フレーム待って出す */
  placeMenu(m,btn);
  requestAnimationFrame(()=>m.classList.add("show"));
}
function closeMenu(instant){
  const m=menuEl, btn=menuBtn;
  if(!m) return;
  menuEl=null; menuBtn=null;
  m.classList.remove("show");
  m.setAttribute("aria-hidden","true");
  document.getElementById("cmenuBack").classList.remove("on");
  if(btn){ btn.classList.remove("on"); btn.setAttribute("aria-expanded","false") }
  /* 閉じるアニメーションが終わってから display を落とす */
  setTimeout(()=>{ if(!m.classList.contains("show")) m.classList.remove("on") }, instant===true?0:170);
}
function openMenu(id,btn){
  const e=EX.find(v=>v.id===id); if(!e) return;
  menuTarget=e;

}
function openAppMenu(btn){

let lastY=0, lastT=0, panelH=0;
function measurePanel(){
  const f=document.getElementById("filters");
  if(f && state.filtersOpen && f.offsetHeight>40) panelH=f.offsetHeight;
}
/* スクロールの勢い（px/ms）から収納にかける時間を決める。
   ゆっくり送れば ~480ms、勢いよく弾けば ~130ms。 */
function animateFilters(open,ms){
  const f=document.getElementById("filters");
  f.style.setProperty("--fdur", Math.round(ms||420)+"ms");
  setFilters(open,false);
  setTimeout(()=>f.style.setProperty("--fdur","420ms"), (ms||420)+80);
}

/* 絞り込み欄が「ちょうど画面外へ隠れる」ぶんだけスクロールしたら一度だけ収納。
   そのあとの開閉は手動にまかせる。 */
window.addEventListener("scroll",()=>{
  const y=window.scrollY||document.documentElement.scrollTop||0;
  const t=performance.now();
  const v=Math.abs(y-lastY)/Math.max(1,t-lastT);      /* px/ms */
  const trigger=Math.max(70, panelH*0.85);
  if(state.filtersOpen && y>=trigger && y>lastY){
    measurePanel();
    animateFilters(false, Math.max(130, Math.min(480, 480 - v*160)));
  }
  lastY=y; lastT=t;
},{passive:true});

/* 保存した現在地を使う。有効期限は6時間。
   これがあるうちは端末に問い合わせないので、許可ダイアログも出ない。 */
const POS_TTL=7*24*60*60*1000;
/* ブラウザ側で既に「許可」になっているかどうか。granted のときだけ、
   起動時にこっそり取り直す（ダイアログは出ない）。 */
async function geoGranted(){
  try{
    if(!navigator.permissions || !navigator.permissions.query) return false;
    const st=await navigator.permissions.query({name:"geolocation"});
    return st.state==="granted";
  }catch(_){ return false }
}
function grabPos(silent){
  return new Promise(res=>{
    if(!navigator.geolocation) return res(false);
    navigator.geolocation.getCurrentPosition(
      p=>{
        state.pos={lat:p.coords.latitude,lng:p.coords.longitude};
        store.set("pos",{lat:state.pos.lat,lng:state.pos.lng,t:Date.now()});
        res(true);
      },
      ()=>res(false),
      {enableHighAccuracy:false,timeout:silent?12000:8000,maximumAge:POS_TTL}
    );
  });
}
function cachedPos(){
  const c=store.get("pos",null);
  if(c && typeof c.lat==="number" && Date.now()-c.t < POS_TTL) return c;
  return null;
}
/* 実際に端末へ問い合わせるのは、ユーザーが「近い順」を選んだときだけ。
   読み込みのたびに呼ぶと毎回ダイアログが出てしまう。 */
function locate(){
  if(!navigator.geolocation) return;
  const c=cachedPos();
  if(c){ state.pos={lat:c.lat,lng:c.lng}; render(); restartView(); return; }
  const cl=document.getElementById("countLabel");
  cl.classList.add("pinging");
  navigator.geolocation.getCurrentPosition(
    p=>{
      cl.classList.remove("pinging");
      state.pos={lat:p.coords.latitude,lng:p.coords.longitude};
      store.set("pos",{lat:state.pos.lat,lng:state.pos.lng,t:Date.now()});
      render(); restartView();
    },
    ()=>{cl.classList.remove("pinging");cl.textContent+="（位置情報が取得できませんでした）"},
    {enableHighAccuracy:false,timeout:8000,maximumAge:POS_TTL}
  );
}

  if(P && typeof P==="object"){
    if(FEE_TXT[P.fee]) state.fee=P.fee;
    if(SORT_TXT[P.sort]) state.sort=P.sort;
    if(VIEW_TXT[P.view]) state.view=P.view;
    if(P.gz==="fit"||P.gz==="day") state.gz=P.gz;
    if(P.tz==="2"||P.tz==="3") state.tz=P.tz;
    if(P.area==="all"||EX.some(e=>e.area===P.area)) state.area=P.area;
    state.favOnly=!!P.favOnly;
    state.festOnly=!!P.festOnly;
  }
  document.querySelectorAll("#feeChips .chip[data-fee]")
    .forEach(b=>b.setAttribute("aria-pressed",b.dataset.fee===state.fee));
  document.getElementById("favChip").setAttribute("aria-pressed",state.favOnly);
  document.getElementById("festChip").setAttribute("aria-pressed",state.festOnly);
  sel.value=state.area;
  document.getElementById("sortSel").value=state.sort;

  /* 保存済みの現在地があれば、最初の描画より前に入れておく。
     後から入れると、並び替えを「近い順」にするまで所要時間が出ない。
     端末には問い合わせないので、ここでダイアログは出ない。 */
  const pc=cachedPos();
  if(pc) state.pos={lat:pc.lat,lng:pc.lng};

  /* #s=... 付きで開かれたら、その人のお気に入りだけを並べるモードにする。
     自分のお気に入り絞り込みとは意味がぶつかるので、そちらは解除しておく。 */
  state.shared=readShare();
  if(state.shared){
    state.favOnly=false;
    if(state.shareMode==="view") state.open.add([...state.shared][0]);
    document.getElementById("favChip").setAttribute("aria-pressed",false);
  }
  syncShareBar();

  render();
  setFilters(fOpen!==false,false);
  requestAnimationFrame(()=>{moveTabInd();measurePanel()});

  /* 時間ラベルだけ1分ごとに見直す。開き直さなくても
     「開館中 → 閉館間近（赤・点滅）」に切り替わるように。
     再描画はしないので、スクロール位置やアニメーションには触らない。 */
  setInterval(()=>{
    document.querySelectorAll(".card[data-id]").forEach(el=>{
      const e=EX.find(x=>String(x.id)===el.dataset.id);
      if(!e) return;
      const tag=el.querySelector(".tag.clock");
      if(!tag || tag.classList.contains("dim")) return;
      const ck=clockClass(e);
      tag.classList.toggle("live",ck.includes("live"));
      tag.classList.toggle("closing",ck.includes("closing"));
      tag.classList.toggle("off",ck.includes("off"));
    });
  },60000);

  /* すでに許可済みの端末では、裏で静かに最新の位置へ更新しておく。
     未許可のときは何もしないので、勝手にダイアログが出ることはない。 */
  if(await geoGranted()){
    const was=state.pos ? state.pos.lat+","+state.pos.lng : "";
    const ok=await grabPos(true);
    if(ok && (state.pos.lat+","+state.pos.lng)!==was){
      render();
      if(state.sort==="near") restartView();
    }
  }
} catch(err){ fail(err) } })();
</script>
</body>
</html>
