<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>行きたい展示会 — 2026 / 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E7E5DF;
  --card:#FFFFFF;
  --ink:#15171A;
  --sub:#6C7076;
  --faint:#9AA0A6;
  --line:#D6D2CA;
  --line-soft:#E8E5DE;
  --mark:#1B3A6B;
  --urgent:#C3172C;
  --warn:#B4761A;
  --ok:#2C7A5E;
  --shadow:0 1px 0 rgba(0,0,0,.045), 0 6px 18px -12px rgba(20,20,25,.35);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:15px; line-height:1.65;
  padding-bottom:env(safe-area-inset-bottom);
  -webkit-font-smoothing:antialiased;
}
button,select,input{font-family:inherit;font-size:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
a{color:inherit}

/* ---------- header ---------- */
.top{
  position:sticky; top:0; z-index:40;
  background:rgba(231,229,223,.93);
  backdrop-filter:saturate(1.4) blur(12px);
  -webkit-backdrop-filter:saturate(1.4) blur(12px);
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 0;
}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.brand h1{
  font-family:"Zen Old Mincho",serif; font-weight:900;
  font-size:20px; letter-spacing:.06em; margin:0; line-height:1.2;
}
.today{font-size:11px;color:var(--sub);letter-spacing:.08em;white-space:nowrap;font-variant-numeric:tabular-nums}

.tabs{display:flex;gap:2px;margin:10px -2px 0}
.tabs button{
  flex:1; padding:8px 4px 9px; font-size:12.5px; font-weight:700; letter-spacing:.04em;
  color:var(--sub); border-bottom:2px solid transparent; transition:.15s;
}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

/* ---------- filters ---------- */
.filters{padding:10px 0 11px;display:flex;flex-direction:column;gap:8px}
.chiprow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.chiprow::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; padding:5px 12px; border-radius:999px;
  border:1px solid var(--line); background:#fff; color:var(--sub);
  font-size:12.5px; font-weight:500; white-space:nowrap; transition:.12s;
}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.chip.heart[aria-pressed="true"]{background:var(--urgent);border-color:var(--urgent)}
.selectrow{display:flex;gap:6px}
.sel{
  flex:1; position:relative; border:1px solid var(--line); background:#fff;
  border-radius:9px; padding:5px 22px 5px 9px; font-size:12.5px;
  appearance:none; -webkit-appearance:none; min-width:0;
}
.selwrap{flex:1;position:relative;min-width:0}
.selwrap::after{
  content:"";position:absolute;right:9px;top:50%;width:5px;height:5px;
  border-right:1.5px solid var(--faint);border-bottom:1.5px solid var(--faint);
  transform:translateY(-70%) rotate(45deg);pointer-events:none
}
.count{font-size:11px;color:var(--faint);letter-spacing:.05em;padding:0 2px}

/* ---------- layout ---------- */
.wrap{padding:14px 14px 40px;max-width:760px;margin:0 auto}
.view{display:none}
.view.on{display:block}

/* ---------- card ---------- */
.card{
  background:var(--card); border-radius:var(--r); box-shadow:var(--shadow);
  margin-bottom:11px; overflow:hidden; border:1px solid rgba(0,0,0,.04);
}
.card.ended{opacity:.55}
.chead{padding:13px 14px 12px; display:block; width:100%; text-align:left}
.crow1{display:flex;align-items:flex-start;gap:9px;margin-bottom:2px}
.status{
  flex:0 0 auto; margin-top:3px; font-size:10.5px; font-weight:700; letter-spacing:.06em;
  padding:2px 7px; border-radius:4px; white-space:nowrap;
}
.s-now{background:#EAF3EE;color:var(--ok)}
.s-soon{background:#FBEDE0;color:var(--warn)}
.s-urg{background:#FBE7E9;color:var(--urgent)}
.s-pre{background:#E9EEF6;color:var(--mark)}
.s-end{background:#EEECE7;color:var(--faint)}
.ctitle{
  font-family:"Zen Old Mincho",serif; font-weight:700; font-size:17.5px;
  line-height:1.42; letter-spacing:.01em; margin:0; flex:1;
}
.csub{font-size:12px;color:var(--sub);margin:1px 0 0;line-height:1.5}
.cmeta{display:flex;flex-wrap:wrap;gap:5px 10px;font-size:11.5px;color:var(--sub);margin-top:7px;align-items:center}
.cmeta b{font-weight:700;color:var(--ink)}
.tag{border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:10.5px;letter-spacing:.03em}
.tag.free{border-color:#B9D6C7;background:#F0F7F3;color:var(--ok);font-weight:700}
.tag.check{border-color:#E3CFA6;background:#FBF5E9;color:#96701F}
.tag.today-off{border-color:#E8BFC5;background:#FBEDEF;color:var(--urgent);font-weight:700}

/* ---------- 会期メーター (hero) ---------- */
.meter{margin-top:11px}
.mline{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:var(--sub);margin-bottom:5px;font-variant-numeric:tabular-nums}
.mleft{font-weight:700;letter-spacing:.02em}
.mtrack{
  position:relative; height:7px; border-radius:99px; background:#EDEAE3; overflow:hidden;
}
.mfill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;transition:width .4s ease}
.mtrack.pre{background:repeating-linear-gradient(115deg,#E4E8F0 0 5px,#EDEFF4 5px 10px)}
.mtrack .knob{
  position:absolute;top:-3px;width:2px;height:13px;border-radius:2px;background:var(--ink);
  transform:translateX(-1px);
}
.days{font-family:"Zen Old Mincho",serif;font-weight:900;font-size:15px;letter-spacing:0;line-height:1}

/* ---------- 休廊ドット ---------- */
.week{display:flex;gap:3px;align-items:center;margin-top:10px}
.wlab{font-size:10px;color:var(--faint);margin-right:3px;letter-spacing:.06em}
.wd{
  width:19px;height:19px;border-radius:5px;display:grid;place-items:center;
  font-size:10px;font-weight:700;background:#F4F2ED;color:var(--sub);border:1px solid transparent;
}
.wd.off{background:#FBEDEF;color:var(--urgent);border-color:#F0D6DA;text-decoration:line-through;text-decoration-thickness:1.5px}
.wd.today{outline:2px solid var(--ink);outline-offset:1px}

/* ---------- action icons ---------- */
.acts{display:flex;gap:6px;padding:0 14px 13px;align-items:center}
.ib{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;
  display:grid;place-items:center;transition:.12s;flex:0 0 auto;
}
.ib:active{transform:scale(.94)}
.ib svg{width:18px;height:18px;stroke:var(--ink);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ib.fav svg{stroke:var(--faint)}
.ib.fav[aria-pressed="true"]{background:var(--urgent);border-color:var(--urgent)}
.ib.fav[aria-pressed="true"] svg{stroke:#fff;fill:#fff}
.ib.artist{background:var(--mark);border-color:var(--mark)}
.ib.artist svg{stroke:#fff}
.ib.disabled{opacity:.35;pointer-events:none}
.spacer{flex:1}
.expand{font-size:11.5px;color:var(--sub);display:flex;align-items:center;gap:4px;padding:0 4px;font-weight:500}
.expand svg{width:11px;height:11px;stroke:var(--sub);stroke-width:2.2;fill:none;transition:.2s}
.card.open .expand svg{transform:rotate(180deg)}

/* ---------- detail ---------- */
.detail{display:none;padding:0 14px 15px;border-top:1px solid var(--line-soft);margin:0 14px;padding-left:0;padding-right:0}
.card.open .detail{display:block}
.detail p{margin:12px 0 0;font-size:13.5px;line-height:1.78;color:#2C3036}
.dl{margin:13px 0 0;display:grid;grid-template-columns:62px 1fr;gap:6px 10px;font-size:12.5px}
.dl dt{color:var(--faint);font-size:11.5px;letter-spacing:.04em}
.dl dd{margin:0;color:#2C3036}
.note{
  margin-top:12px;padding:9px 11px;background:#FBF5E9;border:1px solid #EFE1C4;
  border-radius:8px;font-size:11.5px;color:#7A5D18;line-height:1.6
}

/* ---------- 早見表 ---------- */
.tblwrap{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:12px;min-width:640px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line-soft);vertical-align:top;white-space:nowrap}
th{font-size:10.5px;color:var(--faint);font-weight:700;letter-spacing:.07em;background:#FAF9F6;position:sticky;top:0;z-index:2}
td.nm{white-space:normal;min-width:170px;font-family:"Zen Old Mincho",serif;font-weight:700;font-size:13px;line-height:1.4}
td.nm small{display:block;font-family:"Zen Kaku Gothic New",sans-serif;font-weight:400;font-size:11px;color:var(--sub);margin-top:2px}
tr.ended td{opacity:.5}
.num{font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:7px;height:7px;border-radius:99px;margin-right:5px;vertical-align:1px}

/* ---------- 会期表 (gantt) ---------- */
.gwrap{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.gscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.gantt{position:relative;min-width:max-content}
.grow{display:flex;align-items:center;height:34px;border-bottom:1px solid var(--line-soft)}
.grow:last-child{border-bottom:0}
.glab{
  position:sticky;left:0;z-index:3;width:118px;flex:0 0 118px;height:100%;
  display:flex;align-items:center;padding:0 8px 0 11px;background:#fff;
  border-right:1px solid var(--line);font-size:11px;line-height:1.25;
  overflow:hidden;
}
.glab span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gtrack{position:relative;height:100%;flex:0 0 auto}
.gbar{
  position:absolute;top:50%;transform:translateY(-50%);height:13px;border-radius:99px;
  display:flex;align-items:center;
}
.gbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:rgba(255,255,255,.42)}
.ghead{display:flex;height:26px;border-bottom:1px solid var(--line);background:#FAF9F6;position:sticky;top:0;z-index:4}
.ghead .glab{background:#FAF9F6;font-size:10px;color:var(--faint);letter-spacing:.07em}
.gmon{
  flex:0 0 auto;border-left:1px solid var(--line-soft);font-size:10px;color:var(--sub);
  display:flex;align-items:center;padding-left:5px;letter-spacing:.03em
}
.gmon.y{color:var(--ink);font-weight:700}
.gnow{position:absolute;top:0;bottom:0;width:1.5px;background:var(--urgent);z-index:2;pointer-events:none}
.gnow::before{
  content:"今日";position:absolute;top:2px;left:3px;font-size:9px;color:var(--urgent);
  font-weight:700;letter-spacing:.05em;background:#fff;padding:0 3px;border-radius:3px
}
.glegend{display:flex;gap:12px;padding:9px 12px;font-size:10.5px;color:var(--sub);flex-wrap:wrap;border-top:1px solid var(--line-soft)}

/* ---------- artist sheet ---------- */
.sheet{
  position:fixed;inset:0;z-index:90;background:var(--paper);
  transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.sheet.on{transform:translateY(0)}
.shead{
  position:sticky;top:0;background:rgba(231,229,223,.95);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:calc(11px + env(safe-area-inset-top)) 14px 11px;
  display:flex;align-items:center;gap:11px;z-index:5
}
.shead .close{width:32px;height:32px;border-radius:9px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;flex:0 0 auto}
.shead .close svg{width:15px;height:15px;stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round}
.shead b{font-size:12px;letter-spacing:.1em;color:var(--sub);font-weight:700}
.sbody{padding:18px 16px 60px;max-width:720px;margin:0 auto}
.aname{font-family:"Zen Old Mincho",serif;font-weight:900;font-size:27px;line-height:1.25;margin:0}
.aname small{display:block;font-family:"Zen Kaku Gothic New",sans-serif;font-weight:500;font-size:12px;letter-spacing:.1em;color:var(--sub);margin-top:6px}
.abio{font-size:14px;line-height:1.85;color:#25292E;margin:16px 0 0}
.ameta{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}
.ameta span{font-size:11px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:3px 10px;color:var(--sub)}
.h3{
  font-family:"Zen Old Mincho",serif;font-weight:700;font-size:14px;letter-spacing:.06em;
  margin:28px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line)
}
.work{
  background:#fff;border-radius:11px;padding:11px 13px;margin-bottom:8px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:11px
}
.work .wt{flex:1;min-width:0}
.work .wt b{display:block;font-family:"Zen Old Mincho",serif;font-size:14px;font-weight:700;line-height:1.4}
.work .wt small{display:block;font-size:11px;color:var(--sub);margin-top:2px}
.imgbtn{
  flex:0 0 auto;border:1px solid var(--line);border-radius:9px;height:34px;padding:0 11px;
  display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--mark);background:#fff
}
.imgbtn svg{width:13px;height:13px;stroke:var(--mark);stroke-width:1.8;fill:none}
.linkbtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.lb{
  border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:9px;
  padding:9px 14px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px
}
.lb.ghost{background:#fff;color:var(--ink)}
.lb svg{width:13px;height:13px;stroke:currentColor;stroke-width:1.8;fill:none}
.disclaim{font-size:11px;color:var(--faint);line-height:1.7;margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}

.empty{text-align:center;padding:50px 20px;color:var(--faint);font-size:13px}
.foot{text-align:center;font-size:10.5px;color:var(--faint);padding:26px 20px 10px;line-height:1.8}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>行きたい展示会</h1>
    <div class="today" id="todayLabel"></div>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true"  data-view="cards">カード</button>
    <button role="tab" aria-selected="false" data-view="table">早見表</button>
    <button role="tab" aria-selected="false" data-view="gantt">会期表</button>
  </nav>
  <div class="filters">
    <div class="chiprow" id="feeChips">
      <button class="chip" data-fee="all"  aria-pressed="true">すべて</button>
      <button class="chip" data-fee="free" aria-pressed="false">無料</button>
      <button class="chip" data-fee="paid" aria-pressed="false">有料</button>
      <button class="chip" data-fee="open" aria-pressed="false">開催中のみ</button>
      <button class="chip" data-fee="today" aria-pressed="false">今日行ける</button>
      <button class="chip heart" id="favChip" aria-pressed="false">♥ お気に入り</button>
    </div>
    <div class="selectrow">
      <div class="selwrap"><select class="sel" id="areaSel"><option value="all">エリア：すべて</option></select></div>
      <div class="selwrap"><select class="sel" id="sortSel">
        <option value="deadline">終了が近い順</option>
        <option value="near">現在地から近い順</option>
        <option value="start">開幕が早い順</option>
        <option value="name">名前順</option>
      </select></div>
    </div>
    <div class="count" id="countLabel"></div>
  </div>
</header>

<main class="wrap">
  <section class="view on" id="view-cards"></section>
  <section class="view" id="view-table"></section>
  <section class="view" id="view-gantt"></section>
  <p class="foot">会期・料金・休廊日は各公式サイトの公開情報にもとづく。<br>変更されることがあるので、出かける前に公式サイトで最終確認を。</p>
</main>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="shead">
    <button class="close" id="sheetClose" aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    <b>ARTIST</b>
  </div>
  <div class="sbody" id="sheetBody"></div>
</div>

<script>
"use strict";

/* =========================================================
   1. アーティスト情報
   ========================================================= */
const ARTISTS = {
  mueck:{ name:"ロン・ミュエク", en:"Ron Mueck", meta:["1958 オーストラリア生","英国在住","彫刻"],
    bio:"シリコンやファイバーグラスで、人間の身体を極端に拡大あるいは縮小して作る具象彫刻家。人形やマペットの造形師としてキャリアを始め、1996年に義母の画家パウラ・レゴの作品のために制作したピノキオ像から美術の世界へ。翌1997年のロイヤル・アカデミー「センセーション」展での《デッド・ダッド》で一躍知られる存在になった。産毛や血管、皮膚のたるみまで再現しながら、サイズだけが決定的に狂っている——その一点によって、見る者は自分の身体感覚を裏切られ、孤独や脆さ、死といった主題に不意に触れることになる。寡作で、年に1〜2点しか完成しない。",
    works:[{t:"Dead Dad",y:"1996–97 / ミクストメディア"},{t:"Boy",y:"1999 / ミレニアム・ドーム出品の巨大少年像"},{t:"A Girl",y:"2006 / 全長5mの新生児"},{t:"Mass",y:"2016–17 / 100個の巨大な頭蓋骨"},{t:"En Garde",y:"2023 / 3頭の巨大な犬"}]},

  paik:{ name:"ナムジュン・パイク", en:"Nam June Paik / 白南準", meta:["1932 ソウル生","2006 没","メディアアートの父"],
    bio:"ビデオアートという領域そのものを発明した作家。東京大学で美学と音楽史を学び（卒論はシェーンベルク）、西ドイツでシュトックハウゼンやジョン・ケージと出会ってフルクサスに合流。1963年、ヴッパータールの個展でテレビ受像機を彫刻の素材として提示し、以後ブラウン管を絵の具のように扱い続けた。チェリスト シャーロット・モーマンとの共作パフォーマンス、ロボット彫刻、衛星中継作品と手法は多岐にわたるが、一貫するのは「テクノロジーを人間の側に引き寄せる」という姿勢。1993年ヴェネチア・ビエンナーレ金獅子賞。「情報スーパーハイウェイ」という言葉の考案者でもある。",
    works:[{t:"Zen for TV",y:"1963 / 走査線一本だけのテレビ"},{t:"TV Buddha",y:"1974 / 仏像が自分の映像を見つめる"},{t:"TV Cello",y:"1971 / モーマンとの共作"},{t:"Good Morning, Mr. Orwell",y:"1984 / 衛星中継作品"},{t:"Electronic Superhighway",y:"1995 / スミソニアン蔵"}]},

  oursler:{ name:"トニー・アウスラー", en:"Tony Oursler", meta:["1957 ニューヨーク生","映像インスタレーション"],
    bio:"立体物に映像を投影する——今日プロジェクションマッピングと呼ばれる手法を、1990年代初頭に美術の文脈で切り拓いた作家。布の塊や卵形のオブジェに、喋り続ける人間の顔を投影した《Dummies》シリーズで知られる。作品は一貫して、メディアが人間の心理をどう作り替えるかを扱う。心霊術、催眠術、都市伝説、監視技術、顔認識といった「見ることと信じること」の周縁にある主題を掘り続けており、デヴィッド・ボウイとの長年の交流でも知られる（ボウイの映像出演作もある）。カリフォルニア芸術大学でマイク・ケリーらと同期。",
    works:[{t:"Dummies / Judy",y:"1994 / 喋る布人形"},{t:"The Influence Machine",y:"2000 / 公園の樹木と煙に投影"},{t:"Specular",y:"2021 / 暗闇に浮かぶ眼の群れ"},{t:"Lock 2,4,6",y:"心理学実験に着想した多面投影"},{t:"Imponderable",y:"2015–16 / 3D長編映像"}]},

  burton:{ name:"ティム・バートン", en:"Tim Burton", meta:["1958 カリフォルニア州バーバンク生","映画監督・画家"],
    bio:"郊外の家で外れ者として育ち、カルアーツを経てディズニーのアニメーターになったが、その暗さゆえに馴染めず退社。以後、ゴシックとおとぎ話と B級ホラーを混ぜた独自の世界を映画で作り続けている。だが本人が繰り返し語るように、出発点はいつも紙の上のドローイングで、ぐるぐると渦を巻く線と、目玉の大きい歪んだ人物像は、映画より先に存在している。近年の展覧会は映画の付録ではなく、この膨大な私的スケッチ群そのものを本体として提示するものが多い。",
    works:[{t:"ビートルジュース",y:"1988"},{t:"シザーハンズ",y:"1990"},{t:"ナイトメアー・ビフォア・クリスマス",y:"1993 / 原案・製作"},{t:"コープスブライド",y:"2005"},{t:"ウェンズデー",y:"2022 / Netflix"}]},

  yoshirotten:{ name:"YOSHIROTTEN", en:"ヨシロットン", meta:["1983 鹿児島生","グラフィック / ファインアート"],
    bio:"グラフィックデザイン、アートディレクション、映像、空間設計を横断しながら、ファインアートの実践を並行して続ける作家。クリエイティブスタジオ YAR 代表として Hermès、Nike、G-SHOCK、宇多田ヒカル、山下達郎、XG などの仕事を手がける一方、キャリア初期から「見えないものの可視化」を軸に作品を発表してきた。サブカルチャーの記号を引用するコラージュ的手法から出発し、近年は色彩・地質・天体へのリサーチをもとにしたSF的な世界観へと深化。365枚のデジタルドローイングから始まった《SUN》シリーズが代表作。",
    works:[{t:"SUN",y:"2021– / 365枚のドローイングから屋外展示へ"},{t:"FUTURE NATURE",y:"2018 / 大規模個展"},{t:"RGB",y:"光の三原色シリーズ"},{t:"FUTURE NATURE II In Kagoshima",y:"霧島アートの森"}], site:"https://yoshirotten.com/"},

  kiyokawa:{ name:"清川あさみ", en:"Asami Kiyokawa", meta:["1979 兵庫県淡路島生","刺繍 / ミクストメディア"],
    bio:"写真や布、書物の上に糸で刺繍を施す独自の手法で知られる美術家。モデルとして活動したのち作家に転じ、《美女採集》で広く知られるようになった。一貫したテーマは「見えないものを可視化すること」——記憶、神話、時間、感情といった触れられないものを、針と糸という極端に遅い手作業で画面に定着させていく。絵本や書籍の仕事も多く、『銀河鉄道の夜』『千年後の百人一首』などがある。近年は生成AI時代の想像力そのものを主題に取り込みつつある。",
    works:[{t:"美女採集",y:"2006– / 写真＋刺繍"},{t:"Serendipity",y:"2025"},{t:"千年後の百人一首",y:"書籍・作品集"},{t:"みえないにわ – Invisible Garden",y:"2026 / 本展の起点となった著書"}]},

  nawa:{ name:"名和晃平", en:"Kohei Nawa", meta:["1975 大阪府生","彫刻 / Sandwich主宰"],
    bio:"「セル（細胞・粒）」という概念を軸に、彫刻の表皮＝知覚のインターフェースを問い続ける彫刻家。剥製や既製品をガラスビーズで覆い、輪郭を曖昧にしながら像を増幅させる《PixCell》シリーズが代表作。京都の宇治にスタジオ Sandwich を構え、建築家・振付家との協働も活発で、ダミアン・ジャレとの舞台作品や、ルーヴル美術館ピラミッド下に設置された《Throne》などスケールの大きな仕事も多い。京都芸術大学教授。",
    works:[{t:"PixCell-Deer",y:"2002– / ガラスビーズで覆われた鹿"},{t:"Throne",y:"2018 / ルーヴル美術館"},{t:"Foam",y:"泡による巨大インスタレーション"},{t:"Biomatrix",y:"シリコーンオイルの気泡"},{t:"VESSEL",y:"ダミアン・ジャレとの舞台作品"}]},

  tada:{ name:"多田美波", en:"Tada Minami", meta:["1924 台湾・高雄生","2014 没","抽象彫刻・光造形"],
    bio:"戦後日本の抽象彫刻を、工業素材と光という二つの武器で切り拓いた作家。女子美術専門学校で西洋画を学び、油彩から出発したが、1957年の炭労会館レリーフを機に立体へ。1962年に多田美波研究所を設立し、生涯で彫刻約200点、建築関連作品約500点を手がけた。ステンレス、アクリル、ガラスブロックを用い、光の反射・透過・屈折そのものを造形の中心に据えた点が独自で、美術館の中よりも駅、ホテル、市庁舎、公園といった生活空間に多く作品を残している。ヘンリー・ムーア大賞、吉田五十八賞、紫綬褒章。",
    works:[{t:"周波数37306505",y:"1965 / 東京都現代美術館蔵"},{t:"黎明",y:"1970 / 帝国ホテル東京の光壁・約7600個のガラスブロック"},{t:"キアロスクーロ",y:"1979 / 東京国立近代美術館"},{t:"皇居新宮殿 光造形",y:"1968"},{t:"瑞雲",y:"1973 / リーガロイヤルホテル大阪"}]},

  hirako:{ name:"平子雄一", en:"Yuichi Hirako", meta:["1982 岡山県生","絵画 / 立体"],
    bio:"人のような身体に植物の頭部を持つ「Wooden Wood」の住人たちを描き続けている作家。ロンドンのウィンブルドン・カレッジ・オブ・アートを卒業後、東京を拠点に活動。扱う「自然」は、人間と対峙する圧倒的な大自然ではなく、花瓶に挿された植物、飼われた動物、公園の緑、街路樹といった、すでに人間の管理下にある身近な自然である。都市に暮らす人間が自然に向けるまなざしそのものを主題化し、その居心地の悪さを、ポップで親しみやすい画面の中に忍ばせる。",
    works:[{t:"Wooden Wood",y:"シリーズ / 植物頭部の人物像"},{t:"Lost in Thought",y:"シリーズ"},{t:"Sacred Tree 01",y:"2026 / 屋外大型立体"},{t:"Human or Nature",y:"2026"}]},

  monet:{ name:"クロード・モネ", en:"Claude Monet", meta:["1840 パリ生","1926 没","印象派"],
    bio:"印象派という呼び名そのものを生んだ《印象、日の出》の作者。ル・アーヴルでブーダンに戸外制作を学び、以後生涯にわたって「対象そのもの」ではなく「対象に当たる光と大気」を描き続けた。積みわら、ポプラ、ルーアン大聖堂、国会議事堂といった連作は、同じモチーフを時間帯と天候を変えて描き分けることで、視覚が捉えるのは物ではなく光の状態にすぎないことを実証してみせた実験でもある。晩年はジヴェルニーの庭に籠もり、白内障で視力を失っていく中で《睡蓮》の大装飾画を描き続けた。2026年は没後100年。",
    works:[{t:"印象、日の出",y:"1872 / マルモッタン美術館"},{t:"睡蓮",y:"1897–1926 / 連作"},{t:"ルーアン大聖堂",y:"1892–94 / 連作"},{t:"積みわら",y:"1890–91 / 連作"},{t:"国会議事堂、バラ色のシンフォニー",y:"1900 / ポーラ美術館蔵"}]},

  janssens:{ name:"アン・ヴェロニカ・ヤンセン", en:"Ann Veronica Janssens", meta:["1956 英国フォークストン生","ブリュッセル在住"],
    bio:"光そのもの、そして人工の霧を素材として扱う作家。1970年代後半は合板・ガラス・コンクリートといった簡素な工業素材を用いていたが、1990年頃から光・音・人工霧へと移り、輪郭を持たない作品を作るようになった。ミニマリズムやアメリカ西海岸の「ライト＆スペース」と近い位置にありながら、ヤンセンの関心は徹底して身体的な知覚の側にある。色霧で満たされた部屋に入ると距離感も方向も失われる——その「見えているのに掴めない」時間の中で、認識という行為そのものが揺らぐ。",
    works:[{t:"Blue, Red and Yellow",y:"2001 / 色霧のパヴィリオン"},{t:"Rose",y:"2007 / スポットライトと人工塵"},{t:"Untitled (blue glitter)",y:"2015– / 床に敷かれた青いグリッター"},{t:"Swings",y:"2000–2023 / 感熱フィルムのブランコ"},{t:"Donut",y:"2003 / プログラム制御された光の投影"}]},

  buren:{ name:"ダニエル・ビュレン", en:"Daniel Buren", meta:["1938 フランス生","コンセプチュアル・アート"],
    bio:"1965年以来、幅8.7cmのストライプだけを使い続けている作家。本人はこれを作品ではなく「視覚の道具（outil visuel）」と呼ぶ。1960年代半ばには許可なく街路にストライプのポスターを貼り、美術館という制度の外側で作品が成立しうるかを問うた。作品が置かれる場所と不可分な in situ と、移動可能な situé のあいだを往復しながら、「我々は何を見ているのか」を問い続けている。パレ・ロワイヤル中庭の《二つの台地》（通称ビュレンの円柱）は、設置時に大論争を巻き起こしたのち、いまやパリの名所になった。1986年ヴェネチア・ビエンナーレ金獅子賞、2007年高松宮殿下記念世界文化賞。",
    works:[{t:"Les Deux Plateaux",y:"1985–86 / パレ・ロワイヤル「ビュレンの円柱」"},{t:"The Observatory of Light",y:"2016 / ルイ・ヴィトン財団"},{t:"Photo-souvenir",y:"in situ作品の記録シリーズ"},{t:"Prismes et miroirs : Haut-relief",y:"近作シリーズ"}]},

  koizumi:{ name:"小泉智貴", en:"Tomo Koizumi", meta:["1988 千葉県生","ドレスデザイナー / 美術作家"],
    bio:"オーガンジーを何百層も重ねてつくる、フリルの塊のようなドレスで知られるデザイナー。中学3年でジョン・ガリアーノの記事に衝撃を受けてデザイナーを志し、千葉大学教育学部で美術教育を学びながら縫製技術研究会で作品を発表していた。2019年、SNSに投稿した作品をスタイリストのケイティ・グランドが見つけたことから、ニューヨーク・ファッションウィークでマーク・ジェイコブスの店舗を会場に突然デビュー。以後メットガラなどで発表を重ねる。東京オリンピック開会式でのMISIAの衣装も手がけた。",
    works:[{t:"NYFW デビューコレクション",y:"2019 / Marc Jacobs 店舗"},{t:"MISIA 東京五輪開会式衣装",y:"2021"},{t:"Met Gala 出品作",y:"複数年"},{t:"色をまとい、夢を縫う",y:"2026 / 本展"}]},

  omori:{ name:"大森敦史", en:"Atsushi Omori", meta:["造型作家","ブランド Block noise"],
    bio:"ホラー作品の造形から、ミュージックビデオに登場するポップでかわいい立体まで、振れ幅の大きい仕事を手がける造型作家。今回が初の個展にあたる。代表作《Rat house》をはじめ、新作の立体4点が公開される。自身のブランド「Block noise」も展開している。",
    works:[{t:"Rat house",y:"代表作"},{t:"目下（もっか）",y:"2026 / 初個展・新作立体4点"}]},

  mitsuzuka:{ name:"三塚新司", en:"Shinji Mitsuzuka", meta:["美術作家","1999 東京藝術大学入学"],
    bio:"スキーパトロール、ライフガード、自転車便メッセンジャーを経て1999年に東京藝術大学へ入学。在学中から子供番組の放送作家として映像の仕事に関わり、その後雑誌編集者、テレビ局ディレクターを経て2018年から作品を発表しはじめた異色の経歴を持つ。「現代において美術のモチーフは社会そのものへと拡張された」という考えのもと、分断と対立を生む情報環境の構造を作品化している。2022年岡本敏子賞。2024年六本木アートナイト出展。本展では科学者・堀部和也との共同研究として、高さ2mのバナナの皮の新作なども発表。",
    works:[{t:"Collective Madness",y:"2026 / 堀部和也との共同研究発表"},{t:"2mのバナナの皮",y:"2026 / 新作"}]}
};

/* =========================================================
   3. state / storage
   ========================================================= */

const store = {
  async get(){ try{ if(window.storage){ const r=await window.storage.get("favs"); return r?JSON.parse(r.value):[] } }catch(e){} return [] },
  async set(v){ try{ if(window.storage) await window.storage.set("favs", JSON.stringify(v)) }catch(e){} }
};

/* =========================================================
   4. helpers
   ========================================================= */
const WD = ["日","月","火","水","木","金","土"];
const MS = 86400000;
const today = (()=>{ const d=new Date(); d.setHours(0,0,0,0); return d })();
const pd = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d) };
const fmt = s => { const d=pd(s); return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}` };
const fmtShort = s => { const d=pd(s); return `${d.getMonth()+1}/${d.getDate()}` };
const diff = (a,b) => Math.round((b-a)/MS);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

function status(e){
  const s=pd(e.start), en=pd(e.end);
  if(today<s) return {k:"pre", days:diff(today,s)};
  if(today>en) return {k:"end", days:0};
  const left=diff(today,en);
  return {k: left<=7 ? "urg" : left<=21 ? "soon" : "now", days:left};
}
function progress(e){
  const s=pd(e.start), en=pd(e.end);
  const total=Math.max(1,diff(s,en)+1);
  return Math.min(1, Math.max(0, (diff(s,today)+1)/total));
}
function meterColor(st){
  return st.k==="urg" ? "var(--urgent)" : st.k==="soon" ? "var(--warn)" : st.k==="pre" ? "var(--mark)" : "var(--ok)";
}
function isClosedToday(e){
  const st=status(e);
  if(st.k!=="now"&&st.k!=="soon"&&st.k!=="urg") return false;
  const t=iso(today);
  if(e.openExceptions && e.openExceptions.includes(t)) return false;
  if(e.extraClosed && e.extraClosed.includes(t)) return true;
  return (e.closed||[]).includes(today.getDay());
}
function haversine(a,b,c,d){
  const R=6371, r=Math.PI/180;
  const dLa=(c-a)*r, dLo=(d-b)*r;
  const x=Math.sin(dLa/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
/* 直線距離 → 実移動距離 → 所要時間の目安 */
function travel(e){
  if(!state.pos) return null;
  const km = haversine(state.pos.lat, state.pos.lng, e.lat, e.lng);
  const route = km*1.35;
  let min;
  if(route<=1.5) min = route/0.08;                         // 徒歩 4.8km/h
  else if(route<=25) min = 12 + route/0.45;                // 都内公共交通（乗換待ち込み）
  else min = 12 + 25/0.45 + (route-25)/1.0;                // 長距離
  return {km, min:Math.round(min), walk:route<=1.5};
}
function fmtMin(m){
  if(m<60) return `約${m}分`;
  const h=Math.floor(m/60), r=m%60;
  return r? `約${h}時間${r}分` : `約${h}時間`;
}
const gmapUrl = e => state.pos
  ? `https://www.google.com/maps/dir/?api=1&origin=${state.pos.lat},${state.pos.lng}&destination=${encodeURIComponent(e.addr||e.venue)}&travelmode=transit`
  : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.addr||e.venue)}`;

  heart:'<svg viewBox="0 0 24 24"><path d="M12 20.5C7 16.7 3.5 13.8 3.5 10.2A4.7 4.7 0 0 1 12 7.4a4.7 4.7 0 0 1 8.5 2.8c0 3.6-3.5 6.5-8.5 10.3z"/></svg>',
  chev:'<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
  img:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M21 16l-5-5-9 9"/></svg>'
};

/* =========================================================
   6. render — cards
   ========================================================= */
function filtered(){
  let a = EX.filter(e=>{
    const st=status(e);
    if(state.fee==="free" && !e.free) return false;
    if(state.fee==="paid" && e.free) return false;
    if(state.fee==="open" && st.k!=="now" && st.k!=="soon" && st.k!=="urg") return false;
    if(state.fee==="today"){
      if(st.k!=="now" && st.k!=="soon" && st.k!=="urg") return false;
      if(isClosedToday(e)) return false;
    }
    if(state.area!=="all" && e.area!==state.area) return false;
    if(state.favOnly && !state.favs.has(e.id)) return false;
    return true;
  });
  const rank = e => { const k=status(e).k; return k==="end"?2 : k==="pre"?1 : 0 };
  a.sort((x,y)=>{
    const rx=rank(x), ry=rank(y);
    if(rx!==ry) return rx-ry;
    if(state.sort==="deadline"){
      if(rx===1) return pd(x.start)-pd(y.start);
      return pd(x.end)-pd(y.end);
    }
    if(state.sort==="start") return pd(x.start)-pd(y.start);
    if(state.sort==="name") return x.title.localeCompare(y.title,"ja");
    if(state.sort==="near"){
      const tx=travel(x), ty=travel(y);
      if(!tx||!ty) return pd(x.end)-pd(y.end);
      return tx.min-ty.min;
    }
    return 0;
  });
  return a;
}

function weekDots(e){
  const off = new Set(e.closed||[]);
  const td = today.getDay();
  return `<div class="week"><span class="wlab">休</span>` +
    WD.map((d,i)=>`<span class="wd ${off.has(i)?"off":""} ${i===td?"today":""}">${d}</span>`).join("") +
    `</div>`;
}

function meterHTML(e){
  const st=status(e), col=meterColor(st), p=progress(e);
  let left, right;
  if(st.k==="pre"){ left=`開幕まで <span class="days" style="color:${col}">${st.days}</span> 日`; right=`${fmt(e.start)} 開幕`; }
  else if(st.k==="end"){ left=`<span style="color:var(--faint)">終了しました</span>`; right=`${fmt(e.end)} 終了`; }
  else if(e.openEnded){ left=`<span style="color:${col}">通年公開</span>`; right=`常設`; }
  else { left=`残り <span class="days" style="color:${col}">${st.days}</span> 日`; right=`${fmt(e.start)} – ${fmt(e.end)}`; }
  const pct = st.k==="pre" ? 0 : Math.round(p*100);
  return `<div class="meter">
    <div class="mline"><span class="mleft">${left}</span><span>${right}</span></div>
    <div class="mtrack ${st.k==="pre"?"pre":""}">
      <div class="mfill" style="width:${pct}%;background:${col}"></div>
      ${st.k!=="pre"&&st.k!=="end"?`<span class="knob" style="left:${pct}%"></span>`:""}
    </div>
  </div>`;
}

const STATUS_TXT = {now:"開催中", soon:"まもなく終了", urg:"終了間近", pre:"開催前", end:"終了"};

function cardHTML(e){
  const st=status(e), tr=travel(e), fav=state.favs.has(e.id), open=state.open.has(e.id);
  const offToday = isClosedToday(e);
  const aKey = e.artist;
  return `<article class="card ${st.k==="end"?"ended":""} ${open?"open":""}" data-id="${e.id}">
    <button class="chead" data-toggle="${e.id}">
      <div class="crow1">
        <span class="status s-${st.k}">${STATUS_TXT[st.k]}</span>
        <h2 class="ctitle">${esc(e.title)}</h2>
      </div>
      <p class="csub">${esc(e.sub)}</p>
      <div class="cmeta">
        <span>${esc(e.area)}</span>
        ${tr?`<span><b>${fmtMin(tr.min)}</b> ${tr.walk?"徒歩":"目安"} · ${tr.km.toFixed(1)}km</span>`:""}
        <span class="tag ${e.free?"free":""}">${e.free?"無料":"有料"}</span>
        ${offToday?`<span class="tag today-off">本日休み</span>`:""}
        ${e.check?`<span class="tag check">要確認</span>`:""}
      </div>
      ${meterHTML(e)}
      ${(e.closed&&e.closed.length)?weekDots(e):""}
    </button>
    <div class="detail">
      <p>${esc(e.desc)}</p>
      <dl class="dl">
        <dt>会場</dt><dd>${esc(e.venue)}</dd>
        <dt>住所</dt><dd>${esc(e.addr)}</dd>
        <dt>会期</dt><dd>${e.openEnded?"通年（常設）":fmt(e.start)+" – "+fmt(e.end)}</dd>
        <dt>時間</dt><dd>${esc(e.hours)}</dd>
        <dt>休み</dt><dd>${esc(e.closedNote)}</dd>
        <dt>料金</dt><dd>${esc(e.price)}</dd>
      </dl>
      ${e.check?`<div class="note">${esc(e.check)}</div>`:""}
    </div>
    <div class="acts">
      <a class="ib" href="${e.url}" target="_blank" rel="noopener" aria-label="公式サイト">${I.ext}</a>
      <button class="ib artist ${aKey?"":"disabled"}" data-artist="${aKey||""}" data-artist2="${e.artist2||""}" aria-label="アーティスト解説">${I.person}</button>
      <a class="ib" href="${gmapUrl(e)}" target="_blank" rel="noopener" aria-label="地図・経路">${I.pin}</a>
      <button class="ib fav" data-fav="${e.id}" aria-pressed="${fav}" aria-label="お気に入り">${I.heart}</button>
      <span class="spacer"></span>
      <button class="expand" data-toggle="${e.id}">${open?"閉じる":"詳細"} ${I.chev}</button>
    </div>
  </article>`;
}

/* =========================================================
   7. render — 早見表
   ========================================================= */
function tableHTML(list){
  const rows = list.map(e=>{
    const st=status(e), tr=travel(e);
    const off = (e.closed&&e.closed.length) ? e.closed.map(i=>WD[i]).join("・") : "なし";
    const col = meterColor(st);
    const left = st.k==="pre" ? `開幕まで${st.days}日` : st.k==="end" ? "終了" : e.openEnded ? "通年" : `${st.days}日`;
    return `<tr class="${st.k==="end"?"ended":""}">
      <td class="nm">${esc(e.title)}<small>${esc(e.venue)}</small></td>
      <td class="num">${e.openEnded?"常設":fmtShort(e.start)+"–"+fmtShort(e.end)}</td>
      <td class="num" style="font-weight:700"><span class="dot" style="background:${col}"></span>${left}</td>
      <td>${e.free?'<span style="color:var(--ok);font-weight:700">無料</span>':"有料"}</td>
      <td class="num">${tr?fmtMin(tr.min):"—"}</td>
      <td>${off}${isClosedToday(e)?' <b style="color:var(--urgent)">今日休</b>':""}</td>
      <td>${esc(e.area)}</td>
    </tr>`;
  }).join("");
  return `<div class="tblwrap"><table>
    <thead><tr><th>展覧会</th><th>会期</th><th>残り</th><th>料金</th><th>所要</th><th>休廊</th><th>エリア</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

/* =========================================================
   8. render — 会期表 (gantt)
   ========================================================= */
function ganttHTML(list){
  const items = list.filter(e=>!e.openEnded);
  if(!items.length) return `<p class="empty">表示できる会期がありません。</p>`;
  let min=null,max=null;
  items.forEach(e=>{ const s=pd(e.start), en=pd(e.end); if(!min||s<min)min=s; if(!max||en>max)max=en; });
  const S=new Date(min.getFullYear(),min.getMonth(),1);
  const E=new Date(max.getFullYear(),max.getMonth()+1,0);
  const span=diff(S,E)+1;
  const PX=2.05, W=span*PX;

  const months=[];
  let c=new Date(S);
  while(c<=E){
    const nx=new Date(c.getFullYear(),c.getMonth()+1,1);
    const end=nx>E?new Date(E.getTime()+MS):nx;
    months.push({d:new Date(c), w:diff(c,end)*PX});
    c=nx;
  }
  const head = `<div class="ghead"><div class="glab">会期表</div>` +
    months.map(m=>`<div class="gmon ${m.d.getMonth()===0?"y":""}" style="width:${m.w}px">${m.d.getMonth()===0||m.d.getTime()===S.getTime()?`${m.d.getFullYear()}.`:""}${m.d.getMonth()+1}</div>`).join("") +
    `</div>`;

  const rows = items.map(e=>{
    const s=pd(e.start), en=pd(e.end), st=status(e);
    const x=diff(S,s)*PX, w=Math.max(4,(diff(s,en)+1)*PX);
    const col=meterColor(st);
    const donePct = st.k==="end" ? 100 : st.k==="pre" ? 0 : Math.round(progress(e)*100);
    return `<div class="grow">
      <div class="glab"><span>${esc(e.title)}</span></div>
      <div class="gtrack" style="width:${W}px">
        <div class="gbar" style="left:${x}px;width:${w}px;background:${col};opacity:${st.k==="end"?.35:1}">
          <i style="width:${donePct}%"></i>
        </div>
      </div>
    </div>`;
  }).join("");

  const nowX = (today>=S&&today<=E) ? 118 + diff(S,today)*PX : null;
  return `<div class="gwrap"><div class="gscroll"><div class="gantt" style="width:${118+W}px">
    ${head}${rows}
    ${nowX!==null?`<div class="gnow" style="left:${nowX}px"></div>`:""}
  </div></div>
  <div class="glegend">
    <span><span class="dot" style="background:var(--ok)"></span>開催中</span>
    <span><span class="dot" style="background:var(--warn)"></span>残り21日以内</span>
    <span><span class="dot" style="background:var(--urgent)"></span>残り7日以内</span>
    <span><span class="dot" style="background:var(--mark)"></span>開催前</span>
    <span>バーの明るい部分＝経過</span>
  </div></div>`;
}

/* =========================================================
   9. render — アーティスト画面
   ========================================================= */
function artistBlock(a){
  const q = encodeURIComponent(a.en ? `${a.name} ${a.en}` : a.name);
  const works = a.works.map(w=>{
    const wq = encodeURIComponent(`${a.en||a.name} ${w.t}`);
    return `<div class="work">
      <div class="wt"><b>${esc(w.t)}</b><small>${esc(w.y)}</small></div>
      <a class="imgbtn" href="https://www.google.com/search?tbm=isch&q=${wq}" target="_blank" rel="noopener">${I.img}画像</a>
    </div>`;
  }).join("");
  return `<h2 class="aname">${esc(a.name)}<small>${esc(a.en||"")}</small></h2>
    <div class="ameta">${a.meta.map(m=>`<span>${esc(m)}</span>`).join("")}</div>
    <p class="abio">${esc(a.bio)}</p>
    <div class="linkbtns">
      <a class="lb" href="https://www.google.com/search?tbm=isch&q=${q}" target="_blank" rel="noopener">${I.img}作品を画像で見る</a>
      <a class="lb ghost" href="https://ja.wikipedia.org/w/index.php?search=${q}" target="_blank" rel="noopener">${I.ext}Wikipedia</a>
      ${a.site?`<a class="lb ghost" href="${a.site}" target="_blank" rel="noopener">${I.ext}公式サイト</a>`:""}
    </div>
    <h3 class="h3">代表作</h3>
    ${works}`;
}

function openArtist(k1,k2){
  const a1=ARTISTS[k1]; if(!a1) return;
  const a2=k2?ARTISTS[k2]:null;
  document.getElementById("sheetBody").innerHTML =
    artistBlock(a1) +
    (a2 ? `<div style="height:34px"></div>` + artistBlock(a2) : "") +
    `<p class="disclaim">「画像」ボタンは Google 画像検索の結果を新しいタブで開きます。現代作家の作品は著作権が生きているため、このページ内に画像を直接埋め込むことはしていません。検索結果から公式サイトや美術館の作品ページに進むのが確実です。</p>`;
  const sh=document.getElementById("sheet");
  sh.classList.add("on"); sh.setAttribute("aria-hidden","false");
  sh.scrollTop=0;
  document.body.style.overflow="hidden";
}
function closeArtist(){
  const sh=document.getElementById("sheet");
  sh.classList.remove("on"); sh.setAttribute("aria-hidden","true");
  document.body.style.overflow="";
}

/* =========================================================
   10. main render
   ========================================================= */
function render(){
  const list=filtered();
  document.getElementById("countLabel").textContent =
    `${list.length} / ${EX.length} 件` + (state.pos ? "　·　現在地から所要時間を表示中" : "　·　位置情報を許可すると所要時間が出ます");

  const cv=document.getElementById("view-cards");
  cv.innerHTML = list.length ? list.map(cardHTML).join("") : `<p class="empty">条件に合う展示がありません。<br>フィルターを緩めてみてください。</p>`;
  document.getElementById("view-table").innerHTML = list.length ? tableHTML(list) : `<p class="empty">条件に合う展示がありません。</p>`;
  document.getElementById("view-gantt").innerHTML = list.length ? ganttHTML(list) : `<p class="empty">条件に合う展示がありません。</p>`;

  ["cards","table","gantt"].forEach(v=>{
    document.getElementById("view-"+v).classList.toggle("on", state.view===v);
  });
}

/* =========================================================
   11. events
   ========================================================= */
document.addEventListener("click", async ev=>{
  const t = ev.target.closest("[data-toggle],[data-fav],[data-artist],[data-view],[data-fee]");
  if(!t) return;

  if(t.dataset.view){
    document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected", b===t));
    state.view=t.dataset.view; render(); return;
  }
  if(t.dataset.fee){
    state.fee=t.dataset.fee;
    document.querySelectorAll("#feeChips .chip[data-fee]").forEach(b=>b.setAttribute("aria-pressed", b===t));
    render(); return;
  }
  if(t.dataset.toggle){
    const id=t.dataset.toggle;
    state.open.has(id)?state.open.delete(id):state.open.add(id);
    const card=document.querySelector(`.card[data-id="${id}"]`);
    if(card){
      card.classList.toggle("open", state.open.has(id));
      const exp=card.querySelector(".expand");
      if(exp) exp.innerHTML = (state.open.has(id)?"閉じる":"詳細") + " " + I.chev;
    }
    return;
  }
  if(t.dataset.fav!==undefined && t.dataset.fav!==""){
    const id=t.dataset.fav;
    state.favs.has(id)?state.favs.delete(id):state.favs.add(id);
    t.setAttribute("aria-pressed", state.favs.has(id));
    await store.set([...state.favs]);
    if(state.favOnly) render();
    return;
  }
  if(t.dataset.artist!==undefined && t.dataset.artist!==""){
    openArtist(t.dataset.artist, t.dataset.artist2||null);
    return;
  }
});

document.getElementById("favChip").addEventListener("click", e=>{
  state.favOnly=!state.favOnly;
  e.currentTarget.setAttribute("aria-pressed", state.favOnly);
  render();
});
document.getElementById("areaSel").addEventListener("change", e=>{ state.area=e.target.value; render() });
document.getElementById("sortSel").addEventListener("change", e=>{
  state.sort=e.target.value;
  if(state.sort==="near" && !state.pos) locate();
  render();
});
document.getElementById("sheetClose").addEventListener("click", closeArtist);
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeArtist() });

/* 位置情報 */
function locate(){
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    p=>{ state.pos={lat:p.coords.latitude, lng:p.coords.longitude}; render() },
    ()=>{ document.getElementById("countLabel").textContent += "（位置情報が取得できませんでした）" },
    {enableHighAccuracy:false, timeout:8000, maximumAge:600000}
  );
}

/* =========================================================
   12. init
   ========================================================= */
(async function init(){
  const d=new Date();
  document.getElementById("todayLabel").textContent =
    `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} (${WD[d.getDay()]})`;

  const areas=[...new Set(EX.map(e=>e.area))];
  const sel=document.getElementById("areaSel");
  areas.forEach(a=>{
    const n=EX.filter(e=>e.area===a).length;
    const o=document.createElement("option"); o.value=a; o.textContent=`${a}（${n}）`;
    sel.appendChild(o);
  });

  const saved=await store.get();
  saved.forEach(id=>state.favs.add(id));

  render();
  locate();
})();
</script>
