:root{--e-out:cubic-bezier(.22,1,.36,1);--e-in-out:cubic-bezier(.5,0,.2,1);--e-in:cubic-bezier(.4,0,.9,.4);--e-back:cubic-bezier(.2,1.16,.4,1);--t-fast:.16s;--t:.28s;--r:14px;
  /* 料金ラベルの「円」の上下位置。漢字は数字より下まで字形が伸びるので、
     マイナス（＝上げる）でちょうど数字の足元に揃う。ここだけで増減できる。 */
  --yen-drop:-.5px; --yen-shift:.4px;
  /* スタイルを変えても標準のまま組む箇所（時間ラベル・曜日・中黒）で使う書体 */
  --f-std:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background-color:var(--paper);color:var(--ink);
  /* スタイルによっては紙目・方眼・ドットが乗る。無地のときは none */
  background-image:var(--paper-tex);background-size:var(--paper-tex-size);background-attachment:scroll;
  font-family:var(--f-body);
  font-size:15px;line-height:1.65;padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased;
  transition:background-color var(--t) var(--e-in-out),color var(--t) var(--e-in-out);
}
html.theming *,html.theming *::before,html.theming *::after{
  transition:background-color .38s var(--e-in-out),color .38s var(--e-in-out),border-color .38s var(--e-in-out),fill .38s,stroke .38s,box-shadow .38s !important;
}
button,select,input{font-family:inherit;font-size:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}

@keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.99)}to{opacity:1;transform:none}}
@keyframes rowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes viewIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes upIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes barGrow{from{transform:translateY(-50%) scaleX(0)}to{transform:translateY(-50%) scaleX(1)}}
@keyframes dotIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
/* 終了系は「暗く沈んで戻る」、開催中は「通常からさらに明るくなる」。
   向きが逆なので、急かされている／今やっている、が一目で区別できる。 */
@keyframes urgPulse{0%,100%{opacity:1}50%{opacity:.52}}
@keyframes nowPulse{
  0%,100%{background-color:var(--tint-ok);color:var(--ok)}
  50%{background-color:var(--tint-ok-hi);color:var(--ok-hi)}
}
@keyframes shimmer{from{background-position:-200px 0}to{background-position:200px 0}}

.top{position:sticky;top:0;z-index:40;background-color:var(--top-bg);background-image:var(--top-tex);background-size:var(--top-tex-size);background-blend-mode:var(--paper-blend);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 0}
.brand{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--f-brand);font-weight:var(--brand-w);
  font-size:23px;letter-spacing:var(--brand-ls);margin:0 0 1px;line-height:1.24;
  /* この書体は太さが1種類しかないので、輪郭を足して太らせる。
     font-weight を上げるとブラウザが機械的に潰すだけで字形が崩れる。
     太さの調整はこの 0.7px を 0.4〜1.1px の範囲で動かす。 */
  -webkit-text-stroke:var(--brand-stroke) currentColor;
  paint-order:stroke fill;
  /* 字間を空けた分、右端に余りが出るので詰め戻す */
  margin-right:calc(var(--brand-ls) * -1)}
.today{font-size:11px;color:var(--sub);letter-spacing:.08em;white-space:nowrap;font-variant-numeric:tabular-nums;margin-top:2px}
/* ヘッダー右上の ⋯ */
.hmore{flex:0 0 auto;width:32px;height:30px;margin:-1px -7px 0 0;display:grid;place-items:center;
  background:none;color:var(--faint);transition:color var(--t)}
.hmore svg{width:18px;height:18px;fill:currentColor;stroke:none}
.hmore:hover,.hmore.on{color:var(--ink)}
.themeseg{position:relative;display:flex;flex:0 0 auto;background:var(--ui-track);border-radius:999px;padding:3px}
.themeseg .thumb{position:absolute;top:3px;left:3px;width:32px;height:26px;border-radius:999px;background:var(--ui-card);box-shadow:var(--ui-sh);transition:transform .42s var(--e-out)}
.themeseg button{position:relative;z-index:2;width:32px;height:26px;display:grid;place-items:center;transition:transform var(--t-fast)}
.themeseg button svg{width:14px;height:14px;stroke:var(--ui-sub);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke var(--t)}
.themeseg button[aria-pressed="true"] svg{stroke:var(--ui-ink)}
.themeseg button:active{transform:scale(.86)}

.viewseg{position:relative;display:flex;align-items:stretch;background:var(--seg-track);border-radius:999px;padding:4px;margin-bottom:2px;
  box-shadow:inset 0 0 0 1px var(--line);transition:background-color var(--t)}
.viewseg .vthumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:999px;background:var(--card);
  box-shadow:0 1px 3px rgba(20,20,25,.16), 0 0 0 1px rgba(0,0,0,.05);transition:transform .42s var(--e-out),background-color var(--t);will-change:transform}
.viewseg button{flex:1;position:relative;z-index:2;padding:8px 0;line-height:1.2;font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--sub);transition:color var(--t),transform var(--t-fast)}
.viewseg button[aria-selected="true"]{color:var(--ink)}

/* フィルター列は絞り込み欄の「下」にある。押すとこの列が下へ動き、
   空いた上側に中身が出てくる。指がいちばん届く高さに操作を置くため。 */
.filtoggle{width:100%;display:flex;align-items:center;gap:8px;padding:9px 2px 11px;font-size:11.5px;color:var(--sub);text-align:left}
.filtoggle:active{opacity:.55}
.filtoggle .fk{flex:0 0 auto;font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:2px 10px;transition:all var(--t)}
.filtoggle[aria-expanded="true"] .fk{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.filtoggle .fsum{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filtoggle .fsum .sep{font-family:var(--f-std);display:inline-block;transform:translateY(.3px)}
/* 中身は上に出るので、閉じているときは上向き（∧）、開いたら下向き（∨＝しまう） */
.filtoggle .fchev{flex:0 0 auto;width:12px;height:12px;stroke:var(--sub);stroke-width:2.2;fill:none;stroke-linecap:round;transform:rotate(180deg);transition:transform .42s var(--e-out)}
.filtoggle[aria-expanded="true"] .fchev{transform:rotate(0deg)}
.filters{display:grid;grid-template-rows:1fr;opacity:1;--fdur:420ms;transition:grid-template-rows var(--fdur) var(--e-out),opacity calc(var(--fdur) * .75) var(--e-out)}
.filters.collapsed{grid-template-rows:0fr;opacity:0;pointer-events:none}
.finner{overflow:hidden;min-height:0;display:flex;flex-direction:column;gap:8px;padding:7px 0 11px}
.filters.collapsed .finner{padding-top:0;padding-bottom:0}

.searchbox{position:relative;display:flex;align-items:center}
.searchbox > svg{position:absolute;left:11px;width:14px;height:14px;stroke:var(--faint);fill:none;stroke-width:1.9;stroke-linecap:round;pointer-events:none}
.searchbox input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 32px 7px 31px;font-size:13px;-webkit-appearance:none;appearance:none;transition:border-color var(--t),background-color var(--t)}
.searchbox input::-webkit-search-cancel-button{display:none}
.searchbox input::placeholder{color:var(--faint)}
.searchbox input:focus{outline:none;border-color:var(--mark)}
.searchbox .clr{position:absolute;right:7px;width:20px;height:20px;border-radius:999px;display:none;place-items:center;background:var(--track)}
.searchbox .clr svg{width:9px;height:9px;stroke:var(--sub);stroke-width:2.6;fill:none;stroke-linecap:round}
.searchbox.has .clr{display:grid}

.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.chip{flex:0 0 auto;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:12.5px;font-weight:500;white-space:nowrap;transition:background-color var(--t),color var(--t),border-color var(--t),transform var(--t-fast)}
.chip:active{transform:scale(.93)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}
.chip.heart[aria-pressed="true"]{background:var(--urgent);border-color:var(--urgent);color:#fff}
.selectrow{display:flex;gap:6px}
.sel{width:100%;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:5px 22px 5px 9px;font-size:12.5px;appearance:none;-webkit-appearance:none;min-width:0}
.sel:focus{border-color:var(--mark);outline:none}
.selwrap{flex:1;position:relative;min-width:0}
.selwrap::after{content:"";position:absolute;right:9px;top:50%;width:5px;height:5px;border-right:1.5px solid var(--faint);border-bottom:1.5px solid var(--faint);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.count{font-size:11px;color:var(--faint);letter-spacing:.05em;padding:0 2px}
.count.pinging{animation:shimmer 1.1s linear infinite;background:linear-gradient(90deg,var(--faint) 0%,var(--ink) 45%,var(--faint) 90%);background-size:200px 100%;-webkit-background-clip:text;background-clip:text;color:transparent}

.wrap{padding:14px 14px 40px;max-width:760px;margin:0 auto}
.view{display:none}
.view.on{display:block;animation:viewIn .3s var(--e-out)}

.card{position:relative;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:11px;overflow:hidden;border:var(--cbw) solid var(--cbc);background-image:var(--card-tex);background-size:var(--card-tex-size);animation:cardIn .44s var(--e-out) backwards;animation-delay:calc(var(--i,0) * 34ms);transition:box-shadow .35s var(--e-out),background-color var(--t),opacity var(--t)}
.card.open{box-shadow:var(--shadow-lift)}
.card.ended{opacity:.5}
/* 共有リンクで見ているリストは、自分のリストと見分けがつくように青みへ寄せる */
.card.shared{background:var(--tint-pre);border-color:var(--share-line)}
.card.shared .mtrack,.card.shared .wd{background:var(--card)}

/* 右上の ⋯ のぶんだけタイトルの折り返しを内側に寄せる */
.chead{padding:13px 42px 11px 14px;display:block;width:100%;text-align:left}
.cmore{position:absolute;top:8px;right:6px;z-index:3;width:32px;height:32px;display:grid;place-items:center;
  border-radius:9px;color:var(--faint);transition:background-color .2s var(--e-out),color .2s var(--e-out)}
.cmore svg{width:17px;height:17px;fill:currentColor;stroke:none}
.cmore:hover,.cmore.on{color:var(--ink)}

/* ⋯ から出るミニメニュー */
.cmenuback{position:fixed;inset:0;z-index:149;display:none}
.cmenuback.on{display:block}
.cmenu{font-family:var(--f-std);position:fixed;z-index:150;display:none;min-width:210px;padding:5px;border-radius:14px;
  background:var(--paper);border:1px solid var(--line-soft);box-shadow:var(--shadow-lift);
  opacity:0;transform:scale(.93) translateY(-5px);transform-origin:top right;
  transition:opacity .13s var(--e-in),transform .13s var(--e-in)}
.cmenu.on{display:block}
.cmenu.show{opacity:1;transform:scale(1) translateY(0);
  transition:opacity .2s var(--e-out),transform .26s var(--e-back)}
.cmenu .cmi,.cmenu .cmrow{opacity:0;transform:translateY(-3px);transition:opacity .18s var(--e-out),transform .18s var(--e-out)}
.cmenu.show .cmi,.cmenu.show .cmrow{opacity:1;transform:none}
.cmenu.show .cmi:nth-of-type(2){transition-delay:.05s}
.cmenu.show .cmi:nth-of-type(3){transition-delay:.09s}
.cmrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:6px 6px 6px 11px;
  font-size:13px;font-weight:700;color:var(--body)}
.cmi{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border-radius:9px;
  font-size:13px;font-weight:700;text-align:left;color:var(--body);
  transition:background-color .15s var(--e-out)}
.cmi svg{width:16px;height:16px;stroke:var(--mark);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.cmi:hover{background:var(--track)}
.cmi[disabled]{opacity:.4}
.cmi.soon{color:var(--sub)}
.cmi.soon svg{stroke:var(--faint)}
.cmi .soonmark{margin-left:auto;font-size:9.5px;font-weight:700;letter-spacing:.04em;color:var(--faint);
  padding:1.5px 5px;border-radius:4px;background:var(--track)}
.cmsep{height:1px;margin:4px 9px;background:var(--line-soft)}
.cbody{padding:11px 14px 15px;display:block;width:100%;text-align:left}
.crow1{display:flex;align-items:flex-start;gap:9px;margin-bottom:3px}
.status{font-family:var(--f-std);flex:0 0 auto;margin-top:3px;font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:4px;white-space:nowrap}
.s-now{background:var(--tint-ok);color:var(--ok);animation:nowPulse 2.05s ease-in-out infinite}
.s-soon{background:var(--tint-urg);color:var(--urgent);animation:urgPulse 1.9s ease-in-out infinite}
.s-urg{background:var(--tint-urg);color:var(--urgent);animation:urgPulse 1.4s ease-in-out infinite}
.s-pre{background:var(--tint-pre);color:var(--mark)}
.s-end{background:var(--tint-end);color:var(--faint)}
.ctitle{font-family:var(--f-disp);font-weight:700;font-size:17px;line-height:1.45;letter-spacing:.005em;margin:0;flex:1}
/* 会場名・駅名・所要時間は必ず1行。右の ⋯ のぶんはこの行では使わないので
   負のマージンで取り返し、それでも足りないときだけ会場名を省略する。 */
.csub{display:flex;align-items:center;flex-wrap:nowrap;gap:0 5px;font-size:12px;color:var(--sub);
  margin:0 -24px 0 0;line-height:1.7;min-width:0}
.csub .vn{font-weight:700;color:var(--body);flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 中黒は字形が行の中心より上・左に置かれる書体が多く、そのままだと左上に寄る */
.csub .sep{font-family:var(--f-std);color:var(--faint);opacity:.7;display:inline-block;transform:translate(.5px,.8px)}
.csub .cnear{display:inline-flex;align-items:center;gap:0 5px;white-space:nowrap;flex:0 0 auto}
.csub .trip{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.csub .trip svg{width:13px;height:13px;stroke:var(--sub);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transform:translateY(1.0px)}
.csub .trip b{font-weight:700;color:var(--body);font-variant-numeric:tabular-nums}

.shots{position:relative;background:var(--shot-bg)}
/* サムネの高さは描画した時点で --ar（高さ÷幅）から決まり、画像が読み込まれても
   あとから変わらない。読み込みで高さが動くと、下の内容が押し下げられて
   スクロール位置がずれる（iOS Safari は位置を補正してくれない）。
   実際の比率は表示後に控えておき、次に開いたときの --ar に使う。 */
.shots .strip{aspect-ratio:1 / var(--ar,.68)}
.shots[hidden]{display:none}
.strip{display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.strip::-webkit-scrollbar{display:none}
/* 横だけこちらで動かす。縦の指の動きはブラウザにそのまま渡すので、
   画面のスクロールは画像の上でも普段どおりに動く。 */
.strip.rail{display:block;overflow:hidden;scroll-snap-type:none;touch-action:pan-y}
.strip.rail .slide{scroll-snap-align:none}
/* will-change は触っている間だけ。ずっと付けたままだと、カードの枚数ぶん
   大きな合成レイヤーが常駐して iOS が重くなる。 */
.track{display:flex;align-items:stretch;transform:translate3d(0,0,0)}
/* strip の高さは --ar で確定しているので、中もそれに合わせる */
.strip.rail .track{height:100%}
.strip.grabbing .track{will-change:transform}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;display:block}
.slide img{width:100%;height:auto;display:block}
.shots.multi .slide{height:100%;display:flex;align-items:center;justify-content:center}
.shots.multi .slide img{width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain}
/* 1枚目だけは黒帯を出さず全面にしき詰める。 */
.shots.multi .slide.lead img{width:100%;height:100%;max-width:none;max-height:none;object-fit:cover}
/* ただし、縦長すぎて高さの上限（AR_MAX）に収まらない絵まで敷き詰めると
   下が落ちる。そのときだけ全体を入れて、余白は同じ絵のぼかしで埋める。 */
.shots.tall .slide img,
.shots.tall.multi .slide.lead img{width:100%;height:100%;max-width:none;max-height:none;object-fit:contain}
.sdots{position:absolute;left:0;right:0;bottom:7px;display:flex;justify-content:center;gap:5px;pointer-events:none}
.sdots i{width:5px;height:5px;border-radius:99px;background:rgba(255,255,255,.5);box-shadow:0 0 3px rgba(0,0,0,.4);transition:width .25s,background-color .25s}
.sdots i.on{background:#fff;width:14px}

.cmeta{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tag{font-family:var(--f-std);display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:10.5px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums;transition:background-color var(--t),color var(--t),border-color var(--t)}
.tag svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tag.free{border-color:transparent;background:var(--tint-ok);color:var(--ok);font-weight:700}
.tag.paid{border-color:transparent;background:var(--tint-pay);color:var(--pay-ink);font-weight:700;font-variant-numeric:tabular-nums}
/* 料金の文字だけをわずかに持ち上げる。ラベルの箱は動かさない */
.tag.paid .tw{font-style:normal;display:inline-block;transform:translateY(-.2px)}
/* Zen Kaku Gothic New は欧文の字面が漢字より小さいので、数字だけ持ち上げて「円」と高さを揃える */
.tag .pn,.mini .mv .pn{font-style:normal;font-weight:700;font-size:1.16em;line-height:1;letter-spacing:-.01em}
/* 数字と「円」の間は詰めない（自然な字間）。負のマージンを入れると
   見た目が詰まるうえ、中身の幅まで短くなって中央からずれる。 */
.tag.paid .pn{margin-right:0}
/* 「当日 2,000円」のように前に言葉があるとき、数字を 1.16em にしたぶん
   空きすぎて見えるので、その手前だけ詰める。頭が数字のものには効かせない。 */
.tag .pn.ct{margin-left:-.13em}
/* 数字を持ち上げたぶん「円」が浮いて見えるので、髪の毛一本ぶん下げる */
.tag .yn{font-style:normal;display:inline-block;transform:translate(var(--yen-shift),var(--yen-drop))}
/* 時計アイコンと文字の高さを合わせる */
.tag .tv{font-style:normal;display:inline-block;transform:translateY(-0.4px)}
.tag .cln{font-style:normal;display:inline-block;transform:translateY(-.95px)}
.tag .dsh{font-style:normal;display:inline-block;transform:translateY(-.7px)}
.tag.today-off{border-color:transparent;background:var(--tint-urg);color:var(--urgent);font-weight:700}
/* 中身だけ1px左へ寄せる（左を削って右に足す＝幅は変えない） */
/* 時計は数字が太いぶん線が細く小さく見えるので、少しだけ大きく・太く */
.tag.clock svg{width:11.7px;height:11.7px;stroke-width:2.2;transform:translateY(-.2px)}
.tag.clock{gap:2px;padding-left:6px;padding-right:8px;border-color:var(--line);color:var(--body);font-variant-numeric:tabular-nums}
.tag.clock.dim,.tag.clock.off{color:var(--faint);border-color:transparent;background:var(--tint-end)}
.tag.clock.live{border-color:transparent;background:var(--tint-ok);color:var(--ok);font-weight:700}
/* 閉館2時間前を切ったら赤で点滅 */
.tag.clock.live.closing{background:var(--tint-urg);color:var(--urgent);animation:urgPulse 1.4s ease-in-out infinite}
.tag.check{border-color:transparent;background:var(--tint-pay);color:var(--pay-ink)}

.meter{margin-top:11px}
.mline{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 10px;font-size:11px;color:var(--sub);margin-bottom:7px;font-variant-numeric:tabular-nums}
.mleft{font-weight:700;font-size:12px;color:var(--body)}
.mright{margin-left:auto;font-size:14.5px;font-weight:700;color:var(--body);letter-spacing:.005em;white-space:nowrap}
.mright .su{color:var(--urgent)}
.mright .sa{color:var(--mark)}
.mright .wd7{font-size:.82em;font-weight:700;margin-left:.5px}
.mtrack{position:relative;height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.mtrack.crit .mfill{animation:urgPulse 1.9s ease-in-out infinite}
.mfill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;transition:width .95s var(--e-out)}
.mtrack.pre{background:repeating-linear-gradient(115deg,var(--hatch-a) 0 5px,var(--hatch-b) 5px 10px)}
.days{font-family:var(--f-disp);font-weight:900;font-size:16px;line-height:1;display:inline-block}
/* 「明日まで」のような言葉版。数字と同じ級数だと重すぎるので一段下げる */
.dword{font-family:var(--f-disp);font-weight:900;font-size:13.5px;line-height:1;display:inline-block;letter-spacing:.01em}

.week{display:flex;gap:3px;align-items:center;margin-top:10px}
/* 漢字は字形が基線より下に張り出すぶん、ただ中央に置くと沈んで見える。
   下に 1px 詰めて、見た目の重心をマスの中心に合わせている。
   斜線(::before)はパディングの外側を基準にしているので動かない。 */
.wd{font-family:var(--f-std);width:19px;height:19px;padding-bottom:1.2px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:700;background:var(--track);color:var(--sub);animation:dotIn .34s var(--e-out) backwards;animation-delay:calc(var(--d,0) * 38ms + 180ms)}
/* 日曜の「日」は字面が左に寄って見えるので 0.2px だけ右へ送る */
.wd.sun{padding-left:.8px}
.wd.off{position:relative;background:var(--tint-urg);color:var(--urgent);opacity:.95}
.wd.off::before{content:"";position:absolute;left:1px;right:1px;top:50%;height:1.3px;margin-top:-.65px;background:var(--urgent);border-radius:2px;transform:rotate(-42deg)}
.wd.today{position:relative;margin-top:0}
.wd.today::after{content:"";position:absolute;left:-3px;right:-3px;top:-3px;bottom:-3px;
  border:1.6px solid var(--ink);border-radius:8px;pointer-events:none}

.acts{display:flex;gap:7px;padding:2px 14px 13px;align-items:center;cursor:pointer}
.ib{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:0 0 auto;transition:transform .2s var(--e-out),background-color var(--t)}
.ib:active{transform:scale(.88)}
.ib svg{width:18px;height:18px;stroke:var(--ink);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ib.fav svg{stroke:var(--faint)}
.ib.fav[aria-pressed="true"]{background:var(--urgent);border-color:var(--urgent)}
.ib.fav[aria-pressed="true"] svg{stroke:#fff;fill:#fff}
.ib.fav.pop svg{animation:pop .3s var(--e-out)}
/* 押しても何も開かないが、ボタンとしては生かす。pointer-events を切ると
   下のカードが反応して勝手に開閉してしまう。 */
.ib.disabled{opacity:.3}
.ib.disabled:active{transform:none}
.more{width:34px;height:34px;display:grid;place-items:center;flex:0 0 auto;transition:transform .2s var(--e-out)}
.more:active{transform:scale(.85)}
.more svg{width:19px;height:19px;stroke:var(--faint);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .55s var(--e-out),stroke var(--t)}
.card.open .more svg{transform:rotate(180deg);stroke:var(--ink)}
.spacer{flex:1}

/* 中身は消さずに、折り畳まれた状態から開く／閉じる。透明度は動かさない。 */
.detail{display:grid;grid-template-rows:0fr;margin:0 14px;transition:grid-template-rows .62s var(--e-out)}
.card.open .detail{grid-template-rows:1fr}
.dinner{overflow:hidden;min-height:0;padding-bottom:14px}
.ddesc{margin:0;padding:16px 0 17px;font-size:13.5px;line-height:1.8;color:var(--body)}
.drow{position:relative;display:grid;grid-template-columns:52px 1fr;gap:12px;padding:16px 0 15px}
.drow::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:repeating-linear-gradient(90deg,var(--dash) 0 4px,transparent 4px 8px);
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 13%,#000 87%,transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 13%,#000 87%,transparent 100%)}
.drow .dk{font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.05em;padding-top:1px;text-align:center}
.drow .dv{font-size:12.5px;color:var(--body);line-height:1.65}
.note{margin-top:12px;padding:9px 11px;background:var(--tint-pay);border-radius:8px;font-size:11.5px;color:var(--pay-ink);line-height:1.6}

/* 早見表 */
.mgroup{margin-bottom:26px;animation:rowIn .4s var(--e-out) backwards;animation-delay:calc(var(--g,0) * 60ms)}
/* 線は「月」のベースラインに乗せる。数字と月の下端に定規を当てた見え方にしたい */
.mhead{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.mhead h3{font-family:var(--f-disp);font-weight:900;font-size:26px;margin:0;line-height:1;font-variant-numeric:tabular-nums}
/* 漢字は同じ級数・同じ太さでも数字より字面が大きく重く見えるので、
   「月」だけ一段落として数字と釣り合わせ、0.2px だけ持ち上げる */
/* 漢字は数字と違って基線より少し下まで字形が下がるので、そのぶん持ち上げて
   「9」と「月」の下端を揃える。ズレが残るときはこの 1.4px を動かす。 */
.mhead h3 .mu{display:inline-block;font-size:.66em;font-weight:700;letter-spacing:.01em;margin-left:1.5px;transform:translateY(var(--mu-y))}
.mhead h3 .my{display:inline-block;font-size:.44em;font-weight:700;color:var(--faint);letter-spacing:.03em;margin-right:6px;vertical-align:var(--my-va)}
/* カード詳細の区切りと同じ点線。月のそばが濃く、右へ向かって消えていく */
.mhead .ln{flex:1;height:1px;transform:translateY(-.2px);
  background:repeating-linear-gradient(90deg,var(--mrule) 0 4px,transparent 4px 8px);
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 44%,transparent 100%);
  mask-image:linear-gradient(90deg,#000 0,#000 44%,transparent 100%)}
.mhead .ct{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px}
/* コンパクト表示。3列に固定して、会場・料金を落とし
   「日付・タイトル・残り日数・お気に入り」だけにする */
.mgrid.c3{grid-template-columns:repeat(3,1fr);gap:6px}
.mini.cp{padding:8px 8px 9px 11px;border-radius:9px}
.mini.cp::before{width:3px}
.mini.cp .md{font-size:14.5px}
.mini.cp .md small{font-size:9px;margin-left:2px}
.mini.cp .md .mtil{font-size:.72em}
.mini.cp .md .mtil:not(.post){margin-right:1.5px}
.mini.cp .md .mtil.post{margin-left:1.5px}
.mini.cp .mt{font-size:10.5px;line-height:1.36;margin-top:4px;min-height:2.72em}
.mini.cp .ml{font-size:9.5px;margin-top:5px}
.mini.cp .mfav{top:5px;right:5px;width:15px;height:15px}
.mini.cp.faved .md{padding-right:19px}
.mini{position:relative;background:var(--card);background-image:var(--card-tex);background-size:var(--card-tex-size);border:var(--cbw) solid var(--cbc);border-radius:var(--r2);padding:11px 12px 11px 15px;overflow:hidden;text-align:left;display:block;width:100%;box-shadow:var(--shadow);transition:transform .2s var(--e-out)}
.mini:active{transform:scale(.975)}
.mini::before{content:"";position:absolute;left:var(--ml-l);top:var(--ml-in);bottom:var(--ml-in);width:var(--ml-w);border-radius:var(--ml-r);background:var(--ac)}
.mini .md{font-family:var(--f-disp);font-size:20px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.mini .md small{font-size:11px;font-family:var(--f-disp);margin-left:3px;color:var(--sub)}
/* 日付が「終了日」であることを頭の波線で示す。開幕日を出すときは後ろに付く */
.mini .md .mtil{font-size:.76em;font-weight:700;color:var(--ink);vertical-align:var(--mtil-va)}
.mini .md .mtil:not(.post){margin-right:3px}
.mini .md .mtil.post{margin-left:3px}
/* svg を丸バッジと同じ寸法にして重ねる。余白が 0 なので、端末側の丸めで
   左右に 0.5px ずれる余地がない。ハートの形は viewBox（24×24）の中心に
   置いてあるので、これで必ず円の中心に来る。
   大きさを変えたいときは、円の px ではなく I.heartFill 側の形を触ること。 */
.mini .mfav{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:999px;
  background:var(--urgent);display:grid;box-shadow:0 1px 3px rgba(0,0,0,.22)}
/* 大きさはこの scale だけで決める。svg 自体は円と同寸のまま重なっていて、
   拡大縮小は中心を基準に効くので、いくつにしてもズレは出ない。 */
.mini .mfav svg{width:100%;height:100%;display:block;fill:#fff;stroke:none;transform:translateY(.4px) scale(.78)}
.mini.faved .md{padding-right:26px}
.mini .md .su{color:var(--urgent)}
.mini .md .sa{color:var(--mark)}
/* タイトルが1行でも2行分の高さを確保する。下に余白ができても、
   日付・タイトル・残り日数の行が全カードで同じ高さに並ぶほうが読みやすい。 */
.mini .mt{font-size:12.5px;font-weight:700;line-height:1.42;margin-top:5px;min-height:2.84em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini .mv{font-family:var(--f-std);font-size:10.5px;color:var(--faint);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .ml{font-size:11.5px;font-weight:700;margin-top:7px;color:var(--ac);font-variant-numeric:tabular-nums}
.mini .ml .fe{color:var(--ok)}
.mini.ended{opacity:.45}

/* 会期表 */
.gtop{display:flex;align-items:center;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.gcap{flex:1 1 170px;margin:0;font-size:10.5px;line-height:1.6;color:var(--sub)}
.gcap b{color:var(--urgent);font-weight:700}
/* ページトップ。スクロールしている間だけ出て、手が止まると引っ込む */
.totop{position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:70;
  width:44px;height:44px;border-radius:999px;display:grid;place-items:center;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-lift);
  opacity:0;transform:translateY(10px) scale(.92);pointer-events:none;
  transition:opacity .22s var(--e-out),transform .26s var(--e-out)}
.totop.on{opacity:1;transform:none;pointer-events:auto}
.totop svg{width:20px;height:20px;display:block;stroke:var(--ink);stroke-width:2.3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.gzoom{display:flex;gap:6px;flex:0 0 auto}
.gzoom button{padding:5px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:11.5px;font-weight:700;color:var(--sub);transition:all var(--t)}
.gzoom button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.gwrap{margin:0 -14px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.ginner{position:relative;background:var(--sheet-bg)}
.gback{position:absolute;top:0;bottom:0;pointer-events:none;z-index:0}
.gback .wk{position:absolute;top:0;bottom:0;background:var(--stripe)}
.gback .dv{position:absolute;top:0;bottom:0;width:1px;background:var(--grid-w)}
.gback .mo{position:absolute;top:0;bottom:0;width:1px;background:var(--grid-m)}
.gnowline{position:absolute;top:0;bottom:0;width:1.5px;z-index:2;pointer-events:none;background:var(--urgent);box-shadow:0 0 7px var(--tint-urg)}
.grow{display:flex;align-items:stretch;width:100%;padding:0;background:none;border:0;position:relative;text-align:left;min-height:38px;color:var(--ink);font-family:inherit;
  animation:rowIn .34s var(--e-out) backwards;animation-delay:calc(var(--i,0) * 24ms)}
.grow.past{opacity:.42}
/* 拡大率だけを変えたときは、行の入場アニメーションを止める */
.gwrap.quiet .grow{animation:none}
.grow.ghead{cursor:default;position:relative;z-index:4;animation:none}
.glabel{position:sticky;left:0;z-index:3;flex:0 0 auto;min-width:0;padding:5px 8px 5px 14px;
  background:var(--card);display:flex;flex-direction:column;justify-content:center;gap:1px;
  box-shadow:1px 0 0 var(--line),inset 0 -1px 0 var(--line-soft)}
.ghead .glabel{background:var(--head-bg);color:var(--faint);font-size:9.5px;letter-spacing:.06em;justify-content:flex-end;padding-bottom:4px;box-shadow:1px 0 0 var(--line),inset 0 -1px 0 var(--line)}
/* 行ごとタップにするとバーを見ようと触っただけで飛んでしまうので、
   飛べるのは左の見出しだけにしてある。バーはただの表示。 */
button.glabel{cursor:pointer;text-align:left;font-family:inherit;color:inherit;
  transition:background-color .18s var(--e-out)}
button.glabel:active{background:var(--track)}
/* 名前と日付は1つのかたまりとして枠の中央に。行間の余りを削って近づける */
.glabel .gn{font-size:11px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ハートの絵は左右に 4/24 ぶんの余白を持っているので、その分（約2px）だけ
   左へ出して、輪郭の左端を下の日付の行頭に合わせる。
   右は逆に詰めて、タイトルをハートに寄せる。 */
.glabel .gfav{display:inline-block;width:12.5px;height:12.5px;margin-left:-2.1px;margin-right:1.5px;vertical-align:-1.5px;transform:translateY(1.2px)}
.glabel .gfav svg{width:12.5px;height:12.5px;display:block;fill:var(--urgent);stroke:none}
.glabel .gd{font-size:9px;line-height:1.15;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.gplot{position:relative;flex:0 0 auto;box-shadow:inset 0 -1px 0 var(--line-soft)}
.ghead .gplot{box-shadow:inset 0 -1px 0 var(--line);background:var(--head-bg)}
.gbar{position:absolute;top:50%;margin-top:-7px;height:14px;border-radius:3px;overflow:hidden;
  box-shadow:0 1px 4px rgba(0,0,0,.18);transform-origin:left center;
  animation:barGrow2 .5s var(--e-out) backwards}
@keyframes barGrow2{from{transform:scaleX(0);opacity:.4}to{transform:scaleX(1);opacity:1}}
.gbar.clipL{border-top-left-radius:0;border-bottom-left-radius:0}
.gbar.clipL::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.85) 0 2px,transparent 2px 4px);z-index:2}
.gbar u{position:absolute;left:0;top:0;bottom:0;text-decoration:none;background:rgba(255,255,255,.42)}
.gmo{position:absolute;top:0;height:18px;font-size:10px;line-height:18px;letter-spacing:.05em;font-weight:700;
  color:var(--sub);border-left:1px solid var(--line);padding-left:5px;white-space:nowrap;overflow:hidden}
.gdy{position:absolute;top:19px;height:16px;font-size:8.5px;line-height:16px;text-align:center;color:var(--faint);font-variant-numeric:tabular-nums}
.gdy.su{color:var(--urgent)}
.gdy.sa{color:var(--mark)}
.gleg{font-size:10px;color:var(--faint);margin:9px 2px 0;line-height:1.7}
.glegend{display:flex;gap:12px;padding:12px 2px 0;font-size:10.5px;color:var(--sub);flex-wrap:wrap;align-items:center}
.scale{flex:1 1 190px;min-width:170px}
.sbar{height:6px;border-radius:99px;background:linear-gradient(90deg,
  hsl(calc(0deg + var(--hue-w)) var(--r-s) var(--r-l)) 0%, hsl(calc(0deg + var(--hue-w)) var(--r-s) var(--r-l)) 8%,
  hsl(calc(18deg + var(--hue-w)) var(--r-s) var(--r-l)) 24%, hsl(calc(35deg + var(--hue-w)) var(--r-s) var(--r-l)) 50%,
  hsl(calc(148deg + var(--hue-c)) var(--m-s) var(--m-l)) 50%, hsl(calc(160deg + var(--hue-c)) var(--m-s) var(--m-l)) 100%)}
.sticks{display:flex;justify-content:space-between;font-size:9px;color:var(--faint);margin-top:3px;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:7px;height:7px;border-radius:99px;margin-right:5px;vertical-align:1px}

.sheetback{position:fixed;top:-110px;bottom:-110px;left:0;right:0;z-index:88;background:rgba(8,9,11,.45);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);opacity:0;visibility:hidden;transition:opacity .12s linear,visibility .12s}
.sheetback.on{transition:opacity .34s var(--e-out),visibility .34s}
.sheetback.on{opacity:1;visibility:visible}
.sheet{position:fixed;left:0;right:0;bottom:-110px;z-index:90;
  height:calc(88dvh + 110px);max-height:calc(88dvh + 110px);max-width:560px;margin:0 auto;
  background:var(--paper);border-radius:20px 20px 0 0;box-shadow:var(--shadow-lift);
  transform:translateY(101%);
  /* 閉じるときだけ速く。開くときは .sheet.on 側で上書き */
  transition:transform .13s cubic-bezier(.5,0,.85,.35), visibility 0s linear .13s;
  overflow:hidden;visibility:hidden;isolation:isolate}
.sheet.on{transition:transform .46s var(--e-out), visibility 0s linear 0s}
@supports not (height:88dvh){.sheet{height:calc(88vh + 110px);max-height:calc(88vh + 110px)}}
.sscroll{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet.on{transform:translateY(0);visibility:visible}
.shead{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--line);
  padding:15px 14px 11px;display:flex;align-items:center;gap:11px;z-index:5}
.grip{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:36px;height:4px;border-radius:99px;background:var(--line)}
.shead .close{width:32px;height:32px;border-radius:999px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:0 0 auto;transition:transform .2s var(--e-out)}
.shead .close:active{transform:scale(.85)}
.shead .close svg{width:15px;height:15px;stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round}
.shead b{font-size:12px;letter-spacing:.1em;color:var(--sub);font-weight:700}
.sbody{padding:18px 16px calc(156px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.sheet.on .sbody > *{animation:upIn .5s var(--e-out) backwards;animation-delay:calc(var(--i,0) * 45ms + 120ms)}
.aname{font-family:var(--f-disp);font-weight:900;font-size:26px;line-height:1.28;letter-spacing:.01em;margin:0}
.aname small{display:block;font-family:var(--f-disp);font-weight:500;font-size:12px;letter-spacing:.1em;color:var(--sub);margin-top:6px}
.abio{font-size:14px;line-height:1.85;color:var(--body);margin:16px 0 0}
.ameta{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}
.ameta span{font-size:11px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:3px 10px;color:var(--sub)}
.h3{font-family:var(--f-disp);font-weight:700;font-size:14px;letter-spacing:.06em;margin:28px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.work{background:var(--card);border-radius:var(--r2);padding:11px 13px;margin-bottom:8px;box-shadow:var(--shadow);display:flex;align-items:center;gap:11px}
.work .wt{flex:1;min-width:0}
.work .wt b{display:block;font-family:var(--f-disp);font-size:14px;font-weight:700;line-height:1.4}
.work .wt small{display:block;font-size:11px;color:var(--sub);margin-top:2px}
.imgbtn{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;height:34px;padding:0 13px;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--mark);background:var(--card)}
.imgbtn svg{width:13px;height:13px;stroke:var(--mark);stroke-width:1.8;fill:none}
.linkbtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.lb{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;padding:9px 16px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.lb.ghost{background:var(--card);color:var(--ink)}
.lb.sm{padding:7px 13px;font-size:11.5px;font-weight:600;color:var(--body)}
.lb.sm svg{width:12px;height:12px}
/* 丸の中にアイコンだけ。円と中身の差は偶数（38-16=22）にして、
   丸めで中心がずれないようにしている。 */
.snsdots{display:flex;align-items:center;gap:9px;margin-top:12px}
/* Wikipedia は丸ではなくピル型のまま並べる */
.snsdots .lb{flex:0 0 auto}
.lb svg.wlogo{width:19px;height:19px}
.sd{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;
  background:var(--card);border:1px solid var(--line);transition:background-color var(--t),border-color var(--t)}
/* color も揃える。Instagram の右上の点は currentColor で描いているので、
   これを書かないとその点だけ文字色（白）で出てしまう。 */
.sd svg{width:20px;height:20px;display:block;color:var(--mark);stroke:var(--mark);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sd svg.xlogo{width:18px;height:18px}
/* Wikipedia の W は文字。線ではなく塗りで描く */
svg.wlogo text{fill:currentColor;stroke:none}
.sd svg.wlogo{width:22px;height:22px}
/* Instagram だけ絵柄が枠いっぱいまで来ないぶん小さく見えるので、
   中心基準の拡大でほんの少しだけ持ち上げる（px を変えると中心がずれる）。 */
/* 拡大すると線も一緒に太くなるので、太さ側を先に落として相殺している。
   実効の太さ＝ stroke-width × scale（1.55 × 1.16 ≒ 1.8）。 */
.sd svg.iglogo{transform:scale(1.24);stroke-width:1.45}
.sd.off{background:var(--sd-off);border-color:transparent}
.sd.off svg{color:var(--faint);stroke:var(--faint)}
.lb svg{width:13px;height:13px;stroke:currentColor;stroke-width:1.8;fill:none}
.disclaim{font-size:11px;color:var(--faint);line-height:1.7;margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}

.empty{text-align:center;padding:50px 20px;color:var(--faint);font-size:13px}
.foot{text-align:center;font-size:10.5px;color:var(--faint);padding:26px 20px 10px;line-height:1.8}
.pressing{transform:scale(.9) translateY(1px)!important;filter:brightness(.93)}
.chip.pressing,.mini.pressing,.skopt.pressing{transform:scale(.955) translateY(1px)!important}
.skcard.pressing{transform:scale(.93)!important;filter:none}
.viewseg button.pressing{transform:scale(.94) translateY(1px)!important}
.ib.pressing{box-shadow:inset 0 2px 5px rgba(0,0,0,.16)}
.modal{font-family:var(--f-std);position:fixed;inset:0;z-index:120;display:none}
.modal.on{display:block}
/* 閉じるときだけ速く。開くときは .modal.show 側で上書きする（アーティストのシートと同じ作り） */
.mback{position:fixed;top:-110px;bottom:-110px;left:0;right:0;background:rgba(8,9,11,.42);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);opacity:0;transition:opacity .12s linear}
.modal.show .mback{opacity:1;transition:opacity .26s var(--e-out)}
.msheet{position:fixed;left:0;right:0;bottom:-110px;padding:24px 14px calc(116px + env(safe-area-inset-bottom));
  background:var(--paper);border-radius:20px 20px 0 0;box-shadow:var(--shadow-lift);
  transform:translateY(102%);transition:transform .13s cubic-bezier(.5,0,.85,.35);max-width:520px;margin:0 auto;
  max-height:calc(86dvh + 110px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  will-change:transform}
@supports not (max-height:86dvh){.msheet{max-height:calc(86vh + 110px)}}
.modal.show .msheet{transform:translateY(0);transition:transform .32s var(--e-out)}
.mtitle{margin:0 0 4px;font-family:var(--f-std);font-weight:700;font-size:15px;line-height:1.4}
.maddr{margin:0 0 14px;font-size:11.5px;color:var(--sub);line-height:1.6}
.mbtn{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;margin-bottom:8px;
  border-radius:13px;background:var(--card);border:var(--cbw) solid var(--cbc);
  font-size:14px;font-weight:700;text-align:left;box-shadow:var(--shadow);transition:transform .18s var(--e-out)}
.mbtn svg{width:17px;height:17px;color:var(--mark);stroke:var(--mark);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
/* X の公式ロゴだけは塗りの1パス。置かれた場所の文字色に合わせる */
svg.xlogo path{fill:currentColor;stroke:none}
.mbtn svg.xlogo{color:var(--mark)}
.mbtn svg.xlogo,.lb svg.xlogo{width:15px;height:15px}
/* 登録がなく検索に飛ぶ行は、登録済みの行と区別できるよう一段落とす */
.mbtn.ask{color:var(--sub)}
.mbtn.ask svg{color:var(--faint);stroke:var(--faint)}
.mbtn.cancel{justify-content:center;background:none;border-color:transparent;box-shadow:none;color:var(--sub);font-weight:500;margin-bottom:0;padding:12px 16px}
.mbtn[disabled]{opacity:.42}
.cmore.pressing,.cmi.pressing{transform:scale(.955)!important;filter:none}

/* 共有リンクで開いたときの帯 */
.sharebar.viewonly #shareAdopt{display:none}
.sharebar{display:none;margin-bottom:13px;padding:12px 14px;border-radius:var(--r);
  background:var(--tint-pre);border:1px solid var(--share-line);animation:rowIn .4s var(--e-out) backwards}
.sharebar.on{display:block}
.sbtxt{font-size:12px;color:var(--sub);line-height:1.6;margin-bottom:9px}
.sbtxt b{display:block;font-family:var(--f-disp);font-size:14px;color:var(--mark);margin-bottom:1px}
.sbacts{display:flex;flex-wrap:wrap;gap:7px}
.sbbtn{padding:8px 13px;border-radius:999px;font-size:12px;font-weight:700;
  background:var(--mark);color:var(--onmark);border:1px solid transparent}
.sbbtn.ghost{background:var(--card);color:var(--body);border-color:var(--line)}
.sbbtn[disabled]{opacity:.5}


/* ===== スタイル選択シート ===== */
.skgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px;margin:0 0 4px}
/* 見本カード自体に data-skin / data-theme を持たせてあるので、
   中身は var() を書くだけでそのスタイルの色・角丸・影・書体になる。 */
.skcard{position:relative;display:flex;flex-direction:column;gap:7px;align-items:stretch;
  padding:10px 8px 9px;border-radius:13px;border:1.5px solid var(--ui-line);
  background-color:var(--paper);background-image:var(--paper-tex);background-size:var(--paper-tex-size);
  transition:transform .18s var(--e-out)}
/* 見本カード自身の枠はそのスタイルの色なので、選択中の印には使えない。
   （ブルータルやポップは元から枠が黒い。）外側に一本、スタイルに
   左右されない色で輪をかける。 */
.skcard.on{outline:2.5px solid var(--ui-ink);outline-offset:2.5px}
.skpv{display:flex;align-items:flex-end;height:32px;padding:5px;border-radius:var(--r);
  background:var(--card);border:var(--cbw) solid var(--cbc);box-shadow:var(--shadow)}
.skpv i{display:block;width:46%;height:5px;border-radius:99px;background:var(--mark)}
.skcard .sknm{font-family:var(--f-disp);font-size:10.5px;font-weight:700;line-height:1.25;text-align:center;color:var(--ink);
  letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skck{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:999px;
  background:var(--ui-ink);display:none;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.28)}
.skcard.on .skck{display:grid}
.skck svg{width:11px;height:11px;stroke:var(--ui-card);stroke-width:2.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.skauto{display:flex;flex-wrap:wrap;gap:7px}
.skopt{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  font-size:12.5px;font-weight:700;color:var(--sub);
  transition:background-color var(--t),color var(--t),border-color var(--t)}
.skopt[aria-pressed="true"]{background:var(--mark);color:var(--onmark);border-color:var(--mark)}
.sknext{margin:12px 0 2px;font-size:11px;color:var(--faint);line-height:1.65;min-height:1.65em}
.cmi .cmval{margin-left:auto;font-style:normal;font-size:11.5px;font-weight:700;color:var(--faint)}


/* ===== 和風：カードを和のラベル仕立てに ===== */
/* 外枠の内側にもう一本、細い罫を回す。和のラベルの二重枠。 */
[data-skin="wafu"] .card::after{content:"";position:absolute;inset:4px;z-index:4;pointer-events:none;
  border:1px solid var(--wa-ac);opacity:.32;border-radius:3px}
/* 四隅の飾り。8枚の細い帯を角に置いて、鉤（かぎ）の形にしている。 */
[data-skin="wafu"] .card::before{content:"";position:absolute;inset:4px;z-index:5;pointer-events:none;opacity:.85;
  background:
    linear-gradient(var(--wa-ac),var(--wa-ac)) 0 0/11px 1.6px no-repeat,
    linear-gradient(var(--wa-ac),var(--wa-ac)) 0 0/1.6px 11px no-repeat,
    linear-gradient(var(--wa-ac),var(--wa-ac)) 100% 0/11px 1.6px no-repeat,
    linear-gradient(var(--wa-ac),var(--wa-ac)) 100% 0/1.6px 11px no-repeat,
    linear-gradient(var(--wa-ac),var(--wa-ac)) 0 100%/11px 1.6px no-repeat,
    linear-gradient(var(--wa-ac),var(--wa-ac)) 0 100%/1.6px 11px no-repeat,
    linear-gradient(var(--wa-ac),var(--wa-ac)) 100% 100%/11px 1.6px no-repeat,
    linear-gradient(var(--wa-ac),var(--wa-ac)) 100% 100%/1.6px 11px no-repeat}
/* 見出しの肩に朱の縦罫 */
[data-skin="wafu"] .ctitle{border-left:2px solid var(--wa-ac);padding-left:10px}
[data-skin="wafu"] .chead{padding-left:17px}
[data-skin="wafu"] .h3{border-bottom-color:var(--wa-ac)}
[data-skin="wafu"] .mini::before{background:linear-gradient(90deg,var(--ac) 0 1.4px,transparent 1.4px 2.6px,var(--ac) 2.6px 4px)}

/* ===== ポップ：アメコミの縁取り ===== */
[data-skin="pop"] .brand h1{-webkit-text-stroke:1.3px #111111}
[data-skin="pop"][data-theme="light"] .brand h1{color:#FFFFFF;text-shadow:2.5px 3px 0 #111111}
[data-skin="pop"][data-theme="dark"] .brand h1{color:#FFE23D;text-shadow:2.5px 3px 0 #E4002B}
/* ラベルにも輪郭。塗り分けが強いぶん、囲ってやると印刷物らしくなる */
[data-skin="pop"] .status{box-shadow:inset 0 0 0 1.6px #111111}
[data-skin="pop"][data-theme="dark"] .status{box-shadow:inset 0 0 0 1.6px #FFE23D}
[data-skin="pop"] .tag.free,[data-skin="pop"] .tag.paid,
[data-skin="pop"] .tag.check,[data-skin="pop"] .tag.today-off{box-shadow:inset 0 0 0 1.4px currentColor}
[data-skin="pop"] .mini::before{box-shadow:inset -1.8px 0 0 var(--cbc)}
[data-skin="pop"] .mtrack{box-shadow:inset 0 0 0 1.4px #111111}
[data-skin="pop"][data-theme="dark"] .mtrack{box-shadow:inset 0 0 0 1.4px #FFE23D}

/* ===== 早見表の縦ライン：スタイルごとの表情 ===== */
[data-skin="neubrutal"] .mini::before{box-shadow:inset -2.4px 0 0 var(--cbc)}
[data-skin="memphis"] .mini::before{box-shadow:inset -2px 0 0 var(--cbc)}
[data-skin="neumorph"] .mini::before{box-shadow:1px 1px 3px rgba(0,0,0,.2)}
/* 方眼紙は定規の目盛りのように刻む */
[data-skin="kousi"] .mini::before{background:repeating-linear-gradient(180deg,var(--ac) 0 5px,transparent 5px 7px)}
[data-skin="grunge"] .mini::before{opacity:.8}

/* ===== 方眼紙：文房具の手ざわり ===== */
/* ヘッダーは大学ノートの表紙のつもりで、方眼を止めて無地＋赤い罫に */
[data-skin="kousi"] .top{border-bottom:0;
  box-shadow:inset 0 -2.5px 0 var(--mark), inset 0 -4.5px 0 var(--card), inset 0 -5.5px 0 var(--line)}
/* カードの上辺に定規の目盛り。10px ごとに短い線、50px ごとに長い線。 */
[data-skin="kousi"] .card::before{content:"";position:absolute;top:0;left:0;right:0;height:9px;z-index:4;pointer-events:none;
  background:
    repeating-linear-gradient(90deg, var(--mrule) 0 1px, transparent 1px 10px) top left/100% 4px no-repeat,
    repeating-linear-gradient(90deg, var(--sub) 0 1px, transparent 1px 50px) top left/100% 9px no-repeat,
    linear-gradient(var(--track),var(--track)) top left/100% 9px no-repeat}
/* ノートの綴じ側にあたる赤い縦罫 */
[data-skin="kousi"] .card::after{content:"";position:absolute;top:0;bottom:0;left:8px;width:1px;z-index:1;pointer-events:none;
  background:var(--mark);opacity:.28}
[data-skin="kousi"] .chead{padding-top:17px}

/* ===== ネオン：管が光っているように ===== */
/* 看板の見立てなので、ライトモードを選んでいても地は暗いまま。
   フォームの既定色とテーマ切替のつまみも、それに合わせて暗い側へ。 */
:root[data-skin="neon"]{color-scheme:dark;
  --ui-track:#2A2F35; --ui-card:#1B1F24; --ui-sub:#959CA4; --ui-ink:#EDEBE5; --ui-line:#3A4148;
  --ui-sh:0 1px 0 rgba(0,0,0,.3), 0 6px 20px -12px rgba(0,0,0,.9)}
[data-skin="neon"] .brand h1{color:#FFFFFF;-webkit-text-stroke:0;
  text-shadow:0 0 4px var(--neon-1),0 0 13px var(--neon-1),0 0 28px var(--neon-2)}
/* 文字も管の一部。白い芯のまわりに色をにじませる */
[data-skin="neon"] .ctitle{text-shadow:0 0 6px rgba(180,250,255,.8),0 0 16px rgba(0,229,255,.55),0 0 30px rgba(0,229,255,.3)}
[data-skin="neon"] .csub,
[data-skin="neon"] .mline,
[data-skin="neon"] .glabel .gn,
[data-skin="neon"] .mini .mt,
[data-skin="neon"] .aname,
[data-skin="neon"] .h3,
[data-skin="neon"] .gcap,
[data-skin="neon"] .count{text-shadow:0 0 6px rgba(140,245,255,.6),0 0 15px rgba(0,229,255,.4)}
[data-skin="neon"] .days,
[data-skin="neon"] .dword,
[data-skin="neon"] .mini .md{text-shadow:0 0 9px currentColor}
[data-skin="neon"] .tag,
[data-skin="neon"] .status,
[data-skin="neon"] .wd,
[data-skin="neon"] .chip{text-shadow:0 0 6px currentColor}
[data-skin="neon"] .mfill,
[data-skin="neon"] .gbar{box-shadow:0 0 10px -1px currentColor}
[data-skin="neon"] .mini::before{box-shadow:0 0 9px var(--ac),0 0 18px var(--ac)}
/* ヘッダーの文字と線も管の一部として光らせる */
[data-skin="neon"] .today,
[data-skin="neon"] .filtoggle .fk,
[data-skin="neon"] .filtoggle .fsum,
[data-skin="neon"] .mline .mleft,
[data-skin="neon"] .mline .mright{text-shadow:0 0 6px rgba(140,245,255,.65),0 0 15px rgba(0,229,255,.45)}
[data-skin="neon"] .filtoggle .fk{box-shadow:0 0 10px -2px var(--neon-1)}
/* 文字送りのために overflow:hidden をかけてある行は、text-shadow が
   その箱の形に切り取られて四角い光になってしまう。ここだけ drop-shadow に
   替えると、切り抜いたあとの字面からにじむので輪郭どおりに光る。 */
[data-skin="neon"] .csub .vn,
[data-skin="neon"] .mini .mt,
[data-skin="neon"] .glabel .gn,
[data-skin="neon"] .filtoggle .fsum{text-shadow:none;
  filter:drop-shadow(0 0 4px rgba(160,248,255,.75)) drop-shadow(0 0 11px rgba(0,229,255,.45))}
/* SVG の線は text-shadow が効かないので drop-shadow で光らせる */
[data-skin="neon"] .filtoggle .fchev,
[data-skin="neon"] .hmore svg,
[data-skin="neon"] .cmore svg,
[data-skin="neon"] .more svg,
[data-skin="neon"] .ib svg,
[data-skin="neon"] .searchbox svg,
[data-skin="neon"] .sd svg,
[data-skin="neon"] .totop svg{filter:drop-shadow(0 0 3px var(--neon-1)) drop-shadow(0 0 8px rgba(0,229,255,.55))}
[data-skin="neon"] .ctitle{text-shadow:0 0 13px rgba(0,229,255,.3)}
[data-skin="neon"] .chip{box-shadow:0 0 9px -3px var(--neon-1)}
[data-skin="neon"] .chip[aria-pressed="true"]{box-shadow:0 0 13px -1px var(--neon-2)}
[data-skin="neon"] .ib,
[data-skin="neon"] .sd,
[data-skin="neon"] .imgbtn,
[data-skin="neon"] .searchbox input,
[data-skin="neon"] .sel{box-shadow:0 0 10px -3px var(--neon-1)}
[data-skin="neon"] .viewseg .vthumb{box-shadow:0 0 15px -2px var(--neon-2),0 0 0 1px rgba(255,46,136,.55)}
[data-skin="neon"] .top{box-shadow:0 1px 14px -5px var(--neon-1)}
[data-skin="neon"] .status,
[data-skin="neon"] .tag{box-shadow:0 0 9px -3px currentColor}
[data-skin="neon"] .wd.today::after{box-shadow:0 0 9px -1px var(--neon-1)}

/* 短いお知らせ */
.toast{font-family:var(--f-std);position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  z-index:200;padding:11px 17px;border-radius:999px;background:var(--ink);color:var(--paper);
  font-size:12.5px;font-weight:700;box-shadow:var(--shadow-lift);opacity:0;pointer-events:none;
  transition:opacity .24s var(--e-out),transform .24s var(--e-out);max-width:82vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div><h1>ART LIST</h1><div class="today" id="todayLabel"></div></div>
    <button class="hmore" id="hMore" aria-label="メニュー" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.75"/><circle cx="12" cy="12" r="1.75"/><circle cx="19" cy="12" r="1.75"/></svg></button>
  </div>
  <div class="filters" id="filters">
   <div class="finner">
    <div class="searchbox" id="searchBox">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input type="search" id="q" placeholder="展覧会・作家・会場・駅で探す" autocomplete="off" enterkeyhint="search">
      <button class="clr" id="qClear" aria-label="クリア"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="chiprow" id="feeChips">
      <button class="chip" data-fee="all"  aria-pressed="true">すべて</button>
      <button class="chip" data-fee="free" aria-pressed="false">無料</button>
      <button class="chip" data-fee="paid" aria-pressed="false">有料</button>
      <button class="chip" data-fee="open" aria-pressed="false">開催中のみ</button>
      <button class="chip" data-fee="today" aria-pressed="false">今日行ける</button>
      <button class="chip" id="festChip" aria-pressed="false">フェス・芸術祭</button>
      <button class="chip heart" id="favChip" aria-pressed="false">お気に入り</button>
    </div>
    <div class="selectrow">
      <div class="selwrap"><select class="sel" id="areaSel"><option value="all">エリア：すべて</option></select></div>
      <div class="selwrap"><select class="sel" id="sortSel">
        <option value="deadline">終了が近い順</option>
        <option value="endfar">終了が遠い順</option>
        <option value="near">現在地から近い順</option>
        <option value="start">開幕が早い順</option>
        <option value="name">名前順</option>

    </div>
    <div class="viewseg" id="viewSeg" role="tablist">
      <span class="vthumb" id="viewThumb"></span>
      <button role="tab" aria-selected="true"  data-view="cards">カード</button>
      <button role="tab" aria-selected="false" data-view="table">早見表</button>
      <button role="tab" aria-selected="false" data-view="gantt">会期表</button>
    </div>
    <div class="count" id="countLabel"></div>
   </div>
  </div>
  <button class="filtoggle" id="filToggle" aria-expanded="true" aria-controls="filters">
    <span class="fk">フィルター</span><span class="fsum" id="filSummary"></span>
    <svg class="fchev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
  </button>
</header>

<main class="wrap">
  <div class="sharebar" id="shareBar">
    <div class="sbtxt"><b id="shareTitle">共有されたマイリスト</b><span id="shareNote"></span></div>
    <div class="sbacts">
      <button class="sbbtn" id="shareAdopt">自分のリストに反映</button>
      <button class="sbbtn ghost" id="shareExit">自分のリストに戻る</button>
    </div>
  </div>
  <section class="view on" id="view-cards"></section>
  <section class="view" id="view-table"></section>
  <section class="view" id="view-gantt"></section>
  <p class="foot">会期・料金・休廊日は各公式サイトの公開情報にもとづく。<br>変更されることがあるので、出かける前に公式サイトで最終確認を。</p>
</main>

<div class="modal" id="mapModal" aria-hidden="true">
  <div class="mback" data-mclose></div>
  <div class="msheet" role="dialog" aria-modal="true">
    <p class="mtitle" id="mapTitle"></p>
    <p class="maddr" id="mapAddr"></p>
    <button class="mbtn" data-mapopen="google"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>Google マップで開く</button>
    <button class="mbtn" data-mapopen="apple"><svg viewBox="0 0 24 24"><path d="M3 20l6.5-16 5 9.5L17 9l4 11z"/></svg>Apple マップで開く</button>
    <button class="mbtn cancel" data-mclose>キャンセル</button>

</div>

<div class="modal" id="linkModal" aria-hidden="true">
  <div class="mback" data-lclose></div>
  <div class="msheet" role="dialog" aria-modal="true">
    <p class="mtitle" id="linkTitle"></p>
    <div id="linkList"></div>
    <button class="mbtn cancel" data-lclose>キャンセル</button>
  </div>
</div>


<div class="modal" id="skinModal" aria-hidden="true">
  <div class="mback" data-kclose></div>
  <div class="msheet" role="dialog" aria-modal="true" aria-label="スタイル">
    <p class="mtitle">スタイル</p>
    <p class="maddr">配色・角の丸み・書体をまとめて入れ替える。読みやすさの作りはそのまま。</p>
    <div class="skgrid" id="skinGrid"></div>
    <p class="mtitle" style="margin-top:22px">時間で自動的に変える</p>
    <p class="maddr">選んだ間隔で、次のスタイルへ順に移る。閉じていた間の分もまとめて進む。</p>
    <div class="skauto" id="skinAuto"></div>
    <p class="sknext" id="skinNext"></p>
    <button class="mbtn cancel" data-kclose>閉じる</button>

</div>

<button class="totop" id="toTop" aria-label="先頭へ戻る" tabindex="-1">

</button>

  <button class="cmi" role="menuitem" data-menuact="favs" id="menuFavBtn"><svg viewBox="0 0 24 24"><path d="M12 16V4"/><path d="M8 7.5L12 3.5l4 4"/><path d="M5 14v5.5a1.5 1.5 0 0 0 1.5 1.5h11a1.5 1.5 0 0 0 1.5-1.5V14"/></svg><span id="menuFavTxt">マイリストを共有</span></button>
  <div class="cmsep"></div>
  <button class="cmi" role="menuitem" data-menuact="skin"><svg viewBox="0 0 24 24"><path d="M12 3.2c-4.9 0-8.8 3.6-8.8 8.1 0 4.4 3.4 7.5 7.6 7.5 1.5 0 2.4-.8 2.4-1.9 0-.5-.2-.9-.5-1.3-.3-.3-.4-.7-.4-1 0-.8.6-1.4 1.5-1.4h1.5c3 0 5.1-2 5.1-5 0-2.4-2.1-5-8.4-5z"/><circle cx="7.6" cy="11.4" r="1.25" style="fill:var(--mark);stroke:none"/><circle cx="11" cy="7.4" r="1.25" style="fill:var(--mark);stroke:none"/><circle cx="15.4" cy="8.4" r="1.25" style="fill:var(--mark);stroke:none"/></svg><span>スタイル</span><i class="cmval" id="menuSkinTxt"></i></button>
  <div class="cmsep"></div>
  <div class="cmrow"><span>テーマ</span>
    <div class="themeseg" role="group" aria-label="表示テーマ">
      <span class="thumb" id="themeThumb"></span>
      <button data-theme-set="light" aria-pressed="false" aria-label="ライト"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg></button>
      <button data-theme-set="dark" aria-pressed="false" aria-label="ダーク"><svg viewBox="0 0 24 24"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z"/></svg></button>
      <button data-theme-set="auto" aria-pressed="true" aria-label="端末に合わせる"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4"/><path d="M12 3.6a8.4 8.4 0 0 1 0 16.8z" stroke="none" style="fill:var(--ui-sub)"/></svg></button>
    </div>
  </div>
</div>

<div class="cmenu" id="cardMenu" role="menu" aria-hidden="true">
  <button class="cmi" role="menuitem" data-menuact="one"><svg viewBox="0 0 24 24"><path d="M12 16V4"/><path d="M8 7.5L12 3.5l4 4"/><path d="M5 14v5.5a1.5 1.5 0 0 0 1.5 1.5h11a1.5 1.5 0 0 0 1.5-1.5V14"/></svg>この展覧会を共有</button>
  <div class="cmsep"></div>
  <button class="cmi soon" role="menuitem" data-menuact="went"><svg viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11"/></svg>行ったことにする<i class="soonmark">準備中</i></button>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="sscroll" id="sheetScroll">
    <div class="shead"><span class="grip"></span>
      <button class="close" id="sheetClose" aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      <b>ARTIST</b>
    </div>
    <div class="sbody" id="sheetBody"></div>
  </div>
</div>

<script>
"use strict";

/* 画像は data URI でも、"mueck-1.webp" のようなファイル名でも OK。
   ファイル名だけのときは IMG_BASE の下を見にいく。 */
const IMG_BASE="images/";   /* 画像は images/ フォルダに置いている */
const imgSrc=v=>/^(data:|https?:|\/|\.)/.test(v)?v:IMG_BASE+v;
/* 画像は images/ に「キー-01.webp」〜「キー-05.webp」で置く。
   キーは、作家がいればその名前、いなければ催しの名前。
   shots("mueck") で 01〜05 の5枚。6枚以上あるものは shots("hirako",6) のように枚数を渡す。
   拡張子が webp でないものは3つめに渡す（例：shots("ryuichi",5,"JPG")）。
   大文字小文字も区別されるので、実際のファイル名どおりに書くこと。
   並び順を入れ替えたいときだけ、下の tada のように配列を直接書く。
   1枚目がカードのメインビジュアルになるので、いちばん強い絵を -01 にする。 */
const shots=(k,n=5,ext="webp")=>
  Array.from({length:n},(_,i)=>`${k}-${String(i+1).padStart(2,"0")}.${ext}`);

/* 1枚目の縦横比（高さ÷幅）の控え。一度表示した展示は、次からこの値で
   場所を先に確保するので、読み込みで高さが変わらない。 */
const AR_DEFAULT=.68;
/* サムネの高さの上限（高さ÷幅）。ポスター1枚もの（A判＝1.41、縦長で 1.5 前後）が
   切れずに収まる高さまで許す。ここを超える絵は敷き詰めず、全体を入れて
   まわりを同じ絵のぼかしで埋める（.shots.tall）。 */
const AR_MAX=1.56;
let AR={};

const IMG={
  /* ---- 作家名をキーにしているもの ---- */
  ninagawa:    shots("ninagawa"),        /* 蜷川実花 */
  mueck:       shots("mueck"),           /* ロン・ミュエク */
  paik:        shots("paik"),            /* ナムジュン・パイク */
  oursler:     shots("oursler"),         /* トニー・アウスラー */
  yoshirotten: shots("yoshirotten"),     /* ヨシロットン */
  burton:      shots("burton"),          /* ティム・バートン */
  hirako:      shots("hirako",6),        /* 平子雄一 */
  janssens:    shots("janssens"),        /* アン・ヴェロニカ・ヤンセン */
  omori:       shots("omori"),           /* 大森敦史 */
  koizumi:     shots("koizumi"),         /* 小泉智貴 */
  buren:       shots("buren"),           /* ダニエル・ビュレン */
  sakamoto:    shots("ryuichi",5,"JPG"),  /* 坂本龍一 + 高谷史郎（スマホ撮影のまま JPG） */
  /* 多田美波。2枚目をメインにしたいので、ここだけ順番を指定している */
  tada:        ["tada-02.webp","tada-01.webp","tada-03.webp","tada-04.webp","tada-05.webp",
                "tada-06.webp","tada-07.webp","tada-08.webp","tada-09.webp","tada-10.webp",

  jerram:{ sns:[{k:"site",t:"lukejerram.com",u:"https://www.lukejerram.com/"}],

  mueck:{ name:"ロン・ミュエク", en:"Ron Mueck", meta:["1958 オーストラリア生","英国在住","彫刻"],
    bio:"シリコンやファイバーグラスで、人間の身体を極端に拡大あるいは縮小して作る具象彫刻家。人形やマペットの造形師としてキャリアを始め、1996年に義母の画家パウラ・レゴの作品のために制作したピノキオ像から美術の世界へ。翌1997年のロイヤル・アカデミー「センセーション」展での《デッド・ダッド》で一躍知られる存在になった。産毛や血管、皮膚のたるみまで再現しながら、サイズだけが決定的に狂っている——その一点によって、見る者は自分の身体感覚を裏切られ、孤独や脆さ、死といった主題に不意に触れることになる。寡作で、年に1〜2点しか完成しない。",

  paik:{ name:"ナムジュン・パイク", en:"Nam June Paik / 白南準", meta:["1932 ソウル生","2006 没","メディアアートの父"],
    bio:"ビデオアートという領域そのものを発明した作家。東京大学で美学と音楽史を学び（卒論はシェーンベルク）、西ドイツでシュトックハウゼンやジョン・ケージと出会ってフルクサスに合流。1963年、ヴッパータールの個展でテレビ受像機を彫刻の素材として提示し、以後ブラウン管を絵の具のように扱い続けた。チェリスト シャーロット・モーマンとの共作パフォーマンス、ロボット彫刻、衛星中継作品と手法は多岐にわたるが、一貫するのは「テクノロジーを人間の側に引き寄せる」という姿勢。1993年ヴェネチア・ビエンナーレ金獅子賞。「情報スーパーハイウェイ」という言葉の考案者でもある。",

  oursler:{ name:"トニー・アウスラー", en:"Tony Oursler", meta:["1957 ニューヨーク生","映像インスタレーション"],
    bio:"立体物に映像を投影する——今日プロジェクションマッピングと呼ばれる手法を、1990年代初頭に美術の文脈で切り拓いた作家。布の塊や卵形のオブジェに、喋り続ける人間の顔を投影した《Dummies》シリーズで知られる。作品は一貫して、メディアが人間の心理をどう作り替えるかを扱う。心霊術、催眠術、都市伝説、監視技術、顔認識といった「見ることと信じること」の周縁にある主題を掘り続けており、デヴィッド・ボウイとの長年の交流でも知られる（ボウイの映像出演作もある）。カリフォルニア芸術大学でマイク・ケリーらと同期。",

  burton:{ name:"ティム・バートン", en:"Tim Burton", meta:["1958 カリフォルニア州バーバンク生","映画監督・画家"],

  yoshirotten:{ name:"YOSHIROTTEN", en:"ヨシロットン", meta:["1983 鹿児島生","グラフィック / ファインアート"],
    bio:"グラフィックデザイン、アートディレクション、映像、空間設計を横断しながら、ファインアートの実践を並行して続ける作家。クリエイティブスタジオ YAR 代表として Hermès、Nike、G-SHOCK、宇多田ヒカル、山下達郎、XG などの仕事を手がける一方、キャリア初期から「見えないものの可視化」を軸に作品を発表してきた。サブカルチャーの記号を引用するコラージュ的手法から出発し、近年は色彩・地質・天体へのリサーチをもとにしたSF的な世界観へと深化。365枚のデジタルドローイングから始まった《SUN》シリーズが代表作。",

  kiyokawa:{ name:"清川あさみ", en:"Asami Kiyokawa", meta:["1979 兵庫県淡路島生","刺繍 / ミクストメディア"],
    bio:"写真や布、書物の上に糸で刺繍を施す独自の手法で知られる美術家。モデルとして活動したのち作家に転じ、《美女採集》で広く知られるようになった。一貫したテーマは「見えないものを可視化すること」——記憶、神話、時間、感情といった触れられないものを、針と糸という極端に遅い手作業で画面に定着させていく。絵本や書籍の仕事も多く、『銀河鉄道の夜』『千年後の百人一首』などがある。近年は生成AI時代の想像力そのものを主題に取り込みつつある。",

    name:"名和晃平", en:"Kohei Nawa", meta:["1975 大阪府生","彫刻 / Sandwich主宰"],

  tada:{ name:"多田美波", en:"Tada Minami", meta:["1924 台湾・高雄生","2014 没","抽象彫刻・光造形"],
    bio:"戦後日本の抽象彫刻を、工業素材と光という二つの武器で切り拓いた作家。女子美術専門学校で西洋画を学び、油彩から出発したが、1957年の炭労会館レリーフを機に立体へ。1962年に多田美波研究所を設立し、生涯で彫刻約200点、建築関連作品約500点を手がけた。ステンレス、アクリル、ガラスブロックを用い、光の反射・透過・屈折そのものを造形の中心に据えた点が独自で、美術館の中よりも駅、ホテル、市庁舎、公園といった生活空間に多く作品を残している。ヘンリー・ムーア大賞、吉田五十八賞、紫綬褒章。",

  hirako:{ name:"平子雄一", en:"Yuichi Hirako", meta:["1982 岡山県生","絵画 / 立体"],
    bio:"人のような身体に植物の頭部を持つ「Wooden Wood」の住人たちを描き続けている作家。ロンドンのウィンブルドン・カレッジ・オブ・アートを卒業後、東京を拠点に活動。扱う「自然」は、人間と対峙する圧倒的な大自然ではなく、花瓶に挿された植物、飼われた動物、公園の緑、街路樹といった、すでに人間の管理下にある身近な自然である。都市に暮らす人間が自然に向けるまなざしそのものを主題化し、その居心地の悪さを、ポップで親しみやすい画面の中に忍ばせる。",
    works:[{t:"Wooden Wood",y:"シリーズ / 植物頭部の人物像"},{t:"Lost in Thought",y:"シリーズ"},{t:"Sacred Tree 01",y:"2026 / 屋外大型立体"},{t:"Human or Nature",y:"2026"}]},

  monet:{ name:"クロード・モネ", en:"Claude Monet", meta:["1840 パリ生","1926 没","印象派"],
    bio:"印象派という呼び名そのものを生んだ《印象、日の出》の作者。ル・アーヴルでブーダンに戸外制作を学び、以後生涯にわたって「対象そのもの」ではなく「対象に当たる光と大気」を描き続けた。積みわら、ポプラ、ルーアン大聖堂、国会議事堂といった連作は、同じモチーフを時間帯と天候を変えて描き分けることで、視覚が捉えるのは物ではなく光の状態にすぎないことを実証してみせた実験でもある。晩年はジヴェルニーの庭に籠もり、白内障で視力を失っていく中で《睡蓮》の大装飾画を描き続けた。2026年は没後100年。",
    works:[{t:"印象、日の出",y:"1872 / マルモッタン美術館"},{t:"睡蓮",y:"1897–1926 / 連作"},{t:"ルーアン大聖堂",y:"1892–94 / 連作"},{t:"積みわら",y:"1890–91 / 連作"},{t:"国会議事堂、バラ色のシンフォニー",y:"1900 / ポーラ美術館蔵"}]},

  janssens:{ name:"アン・ヴェロニカ・ヤンセン", en:"Ann Veronica Janssens", meta:["1956 英国フォークストン生","ブリュッセル在住"],
    bio:"光そのもの、そして人工の霧を素材として扱う作家。1970年代後半は合板・ガラス・コンクリートといった簡素な工業素材を用いていたが、1990年頃から光・音・人工霧へと移り、輪郭を持たない作品を作るようになった。ミニマリズムやアメリカ西海岸の「ライト＆スペース」と近い位置にありながら、ヤンセンの関心は徹底して身体的な知覚の側にある。色霧で満たされた部屋に入ると距離感も方向も失われる——その「見えているのに掴めない」時間の中で、認識という行為そのものが揺らぐ。",
    works:[{t:"Blue, Red and Yellow",y:"2001 / 色霧のパヴィリオン"},{t:"Rose",y:"2007 / スポットライトと人工塵"},{t:"Untitled (blue glitter)",y:"2015– / 床に敷かれた青いグリッター"},{t:"Swings",y:"2000–2023 / 感熱フィルムのブランコ"},{t:"Donut",y:"2003 / プログラム制御された光の投影"}]},

/* =========================================================
   3.5 共有リンク
   お気に入りを「1件1ビット」に畳んで base64url に詰める。
   22件なら 4文字（#s=xxxx）で済むので、URL は短いまま。

   ビットの並びは SHARE_ORDER で固定してある。展示を入れ替えても
   前に配ったリンクがずれないように、ここは並べ替えないこと。
   新しい展示は EX に足したうえで、この配列の「末尾」に id を足す。
   （EX にしか無い id は自動で末尾に回すので、足し忘れても一応動く） */
const SHARE_ORDER = ["ninagawa","moonart","sakamoto","mueck","paik","oursler","yoshirotten","burton",
  "guruguru","invisible","tada","hirako","ueshima","miraikan","janssens","analog","ran","collective",
  "omori","koizumi","buren","arte","mohri","biohazard","designfesta"];
const SHARE_BITS = (()=>{
  const a=[...SHARE_ORDER];
  EX.forEach(e=>{ if(!a.includes(e.id)) a.push(e.id) });
  return a;
})();
const B64U="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
function encFavs(ids){
  const set=new Set(ids);
  let bits=SHARE_BITS.map(id=>set.has(id)?"1":"0").join("").replace(/0+$/,"");
  if(!bits) return "";
  while(bits.length%6) bits+="0";
  let out="";
  for(let i=0;i<bits.length;i+=6) out+=B64U[parseInt(bits.slice(i,i+6),2)];
  return out;
}
function decFavs(code){
  let bits="";
  for(const c of String(code)){
    const v=B64U.indexOf(c);
    if(v<0) return null;
    bits+=v.toString(2).padStart(6,"0");
  }
  const ids=[];
  for(let i=0;i<bits.length && i<SHARE_BITS.length;i++) if(bits[i]==="1") ids.push(SHARE_BITS[i]);
  return ids;
}
const baseURL = () => location.href.split("#")[0];
const favURL  = () => baseURL()+"#s="+encFavs([...state.favs]);
/* 現在の URL（ハッシュ）から共有リストを読む。不正な値なら null。 */
/* 共有には2種類ある。
   #s= … マイリストの共有。自分のリストに取り込める。カードも共有色になる。
   #v= … 展覧会1件を見せるだけの共有。取り込みボタンは出さず、色も変えない。 */
function readShare(){
  const m=location.hash.match(/[#&]([sv])=([A-Za-z0-9_-]+)/);
  if(!m) return null;
  const ids=decFavs(m[2]);
  if(!ids) return null;
  const ok=ids.filter(id=>EX.some(e=>e.id===id));
  if(!ok.length) return null;
  state.shareMode = m[1]==="v" ? "view" : "list";
  return new Set(ok);
}

   3.6 スタイル（スキン）
   配色・角丸・書体の組を data-skin で切り替える。実体は CSS 側の
   [data-skin][data-theme] にあり、ここが持つのは「どれを選んだか」
   と「次にいつ変わるか」だけ。
   ========================================================= */
const SKINS={
  std:"標準", modern:"モダン", chic:"シック", mid:"レトロ", wafu:"和風", pop:"ポップ",
  memphis:"メンフィス", neubrutal:"ブルータル", neumorph:"ニューモーフ",
  kousi:"方眼紙", neon:"ネオン", grunge:"グランジ"
};
const SKIN_LIST=Object.keys(SKINS);
/* 自動切替の間隔。1ヶ月は 30日 とみなす。 */
const AUTO_MS={ half:43200000, d1:86400000, d3:259200000, w1:604800000, m1:2592000000 };
const AUTO_TXT={ off:"オフ", half:"半日", d1:"1日", d3:"3日", w1:"1週間", m1:"1ヶ月" };

function saveSkin(){
  store.set("skin",state.skin);
  store.set("skinAuto",state.skinAuto);
  store.set("skinAt",state.skinAt);
}
/* 経過した分だけ、まとめて先へ進める。
   起点(skinAt)は「間隔の倍数」で足していくので、アプリを開かなかった
   期間があっても切り替えの刻みがずれない。 */
function tickAutoSkin(){
  const per=AUTO_MS[state.skinAuto];
  if(!per) return false;
  const now=Date.now();
  if(!state.skinAt){ state.skinAt=now; saveSkin(); return false }
  const steps=Math.floor((now-state.skinAt)/per);
  if(steps<=0) return false;
  let i=SKIN_LIST.indexOf(state.skin); if(i<0) i=0;
  state.skin=SKIN_LIST[(i+steps)%SKIN_LIST.length];
  state.skinAt+=steps*per;
  saveSkin();
  return true;
}
function nextSkinKey(){
  let i=SKIN_LIST.indexOf(state.skin); if(i<0) i=0;
  return SKIN_LIST[(i+1)%SKIN_LIST.length];
}
/* 端末の上のバーの色。スタイルごとに紙の色が違うので、
   決め打ちにせず、実際に効いている --paper を読んで合わせる。 */
function syncMetaColor(){
  const mt=document.getElementById("metaTheme"); if(!mt) return;
  const c=getComputedStyle(document.documentElement).getPropertyValue("--paper").trim();
  if(c) mt.setAttribute("content",c);
}
/* 和風のときだけ、サイト名を和の呼び名に差し替える */
const BRAND_TXT={ wafu:"美術録" };
function applySkin(animate){
  const root=document.documentElement;
  const h1=document.querySelector(".brand h1");
  if(h1) h1.textContent=BRAND_TXT[state.skin]||"ART LIST";
  if(root.dataset.skin!==state.skin){
    if(animate && !reduced.matches){
      root.classList.add("theming");
      clearTimeout(applySkin._t);
      applySkin._t=setTimeout(()=>root.classList.remove("theming"),460);
    }
    root.dataset.skin=state.skin;
  }
  requestAnimationFrame(syncMetaColor);
  syncSkinUI();
}
function syncSkinUI(){
  const v=document.getElementById("menuSkinTxt");
  if(v) v.textContent=SKINS[state.skin]||"";
  document.querySelectorAll("#skinGrid .skcard").forEach(b=>{
    const on=b.dataset.skinSet===state.skin;
    b.classList.toggle("on",on);
    b.setAttribute("aria-pressed",on);

    b.setAttribute("aria-pressed", b.dataset.auto===state.skinAuto));

}
function syncSkinNext(){
  const el=document.getElementById("skinNext"); if(!el) return;
  const per=AUTO_MS[state.skinAuto];
  if(!per){ el.textContent="いまは自分で選んだものだけを使う。"; return }
  const left=Math.max(0,(state.skinAt||Date.now())+per-Date.now());
  const d=Math.floor(left/MS), h=Math.floor(left%MS/3600000), mi=Math.floor(left%3600000/60000);
  const rest = d>0 ? `${d}日${h}時間` : h>0 ? `${h}時間${mi}分` : `${mi}分`;
  el.textContent=`あと ${rest} で「${SKINS[nextSkinKey()]}」に変わる。`;
}
function renderSkinSheet(){
  const mode=resolveTheme();

  if(g) g.innerHTML=SKIN_LIST.map(k=>
    `<button class="skcard" data-skin-set="${k}" data-skin="${k}" data-theme="${mode}" aria-pressed="false">

       <span class="skck"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>

function openSkinSheet(){

  const m=document.getElementById("skinModal");

  m.classList.remove("show"); m.setAttribute("aria-hidden","true");

document.addEventListener("click",ev=>{
  if(ev.target.closest("[data-kclose]")){ closeSkinSheet(); return }
  const s=ev.target.closest("[data-skin-set]");
  if(s){
    if(state.skin!==s.dataset.skinSet){
      state.skin=s.dataset.skinSet;
      /* 手で選んだ時点から、自動切替の時計も数え直す */
      state.skinAt=Date.now();

/* =========================================================
   4. helpers
   ========================================================= */
const WD=["日","月","火","水","木","金","土"];
const MS=86400000;
const today=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const pd=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const fmt=s=>{const d=pd(s);return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`};
/* 詳細行用。プレーンテキストで曜日まで出す */
const fmtW=s=>{const d=pd(s);return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}(${WD[d.getDay()]})`};
const diff=(a,b)=>Math.round((b-a)/MS);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

function status(e){
  const s=pd(e.start),en=pd(e.end);
  if(today<s) return {k:"pre",days:diff(today,s)};
  if(today>en) return {k:"end",days:0};
  const left=diff(today,en);
  return {k: left<=10?"urg" : left<=21?"soon" : "now", days:left};
}
function progress(e){
  const s=pd(e.start),en=pd(e.end);
  return Math.min(1,Math.max(0,(diff(s,today)+1)/Math.max(1,diff(s,en)+1)));
}
/* 残り日数 → 色相。21日以内（終了間近）は赤〜赤橙に張り付く。 */
function hueFor(d){
  if(d<=10) return 0;
  if(d<=21) return Math.round((d-10)/11*18);   /* 赤 → 朱 */
  if(d<=45) return Math.round(18+(d-21)/24*17); /* 朱 → 橙（35で止める） */
  /* 46日以降は緑帯へ。40〜90°の黄土色は視認性が悪いので通さない。 */
  return Math.round(148+Math.min(1,(d-45)/45)*12);
}
function meterColor(st){
  if(st.k==="pre") return "var(--mark)";
  if(st.k==="end") return "var(--faint)";
  const h=hueFor(st.days);
  /* 締切が近い赤〜橙の帯だけ彩度を上げる */
  return h<=40 ? `hsl(calc(${h}deg + var(--hue-w)) var(--r-s) var(--r-l))`
               : `hsl(calc(${h}deg + var(--hue-c)) var(--m-s) var(--m-l))`;
}
function isClosedToday(e){
  const st=status(e);
  if(!["now","soon","urg"].includes(st.k)) return false;
  const t=iso(today);
  if(e.openExceptions && e.openExceptions.includes(t)) return false;
  if(e.extraClosed && e.extraClosed.includes(t)) return true;
  return (e.closed||[]).includes(today.getDay());
}
/* 時間表記のダッシュ前後に細いスペースを入れる（11:00 – 18:00） */
const spaceDash = t => String(t).replace(/\s*[–—-]\s*/g, "\u2009–\u2009");

/* 今日の営業時間（曜日で変わる場合はその時間） */
function hoursToday(e){
  const x=EXTRA[e.id]||{};
  if(!x.hs) return null;
  const st=status(e);
  const by=(x.hsBy && x.hsBy[today.getDay()]) || x.hs;
  if(isClosedToday(e)) return {txt:spaceDash(by), dim:true};
  if(st.k==="pre" || st.k==="end") return {txt:spaceDash(x.hs), dim:true};
  return {txt:spaceDash(by), dim:false};
}
/* 今この瞬間が開館時間内か。"17:00–翌6:00" のような後日またぎにも対応。 */
function openNowState(e){
  const ht=hoursToday(e);
  if(!ht || ht.dim) return false;
  const m=ht.txt.replace(/[\s\u2009]/g,"").match(/^(\d{1,2}):(\d{2})[\u2013\u2014-](翌)?(\d{1,2}):(\d{2})/);
  if(!m) return false;
  const n=new Date(), cur=n.getHours()*60+n.getMinutes();
  const a=(+m[1])*60+(+m[2]);
  let b=(+m[4])*60+(+m[5]);
  if(m[3] || b<=a) b+=1440;
  const c = (cur>=a&&cur<b) ? cur : ((cur+1440>=a&&cur+1440<b) ? cur+1440 : null);
  return c===null ? null : {left:b-c};
}
const isOpenNow = e => !!openNowState(e);
/* 閉館まで何分を切ったら「閉館間近」扱いにするか */
const CLOSING_SOON_MIN = 120;
function isClosingSoon(e){
  const s=openNowState(e);
  return !!s && s.left<=CLOSING_SOON_MIN;
}
/* 時間ラベルの状態。
   live    … 入場できる
   closing … 閉館2時間前を切った（赤で点滅）
   off     … 今は入れない。最終入場を過ぎたとき、開館前、閉館後。
             時刻はそのまま出したまま、休館日と同じ灰色に落とす。 */
function clockClass(e){
  const s=openNowState(e);
  if(!s) return "off";
  const la=(EXTRA[e.id]||{}).la;
  if(la!=null && s.left<=la) return "off";
  if(s.left<=CLOSING_SOON_MIN) return "live closing";
  return "live";
}
function haversine(a,b,c,d){
  const R=6371,r=Math.PI/180,dLa=(c-a)*r,dLo=(d-b)*r;
  const x=Math.sin(dLa/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function travel(e){
  if(!state.pos) return null;
  const km=haversine(state.pos.lat,state.pos.lng,e.lat,e.lng), route=km*1.35;
  let min;
  if(route<=1.5) min=route/0.08;
  else if(route<=25) min=12+route/0.45;
  else min=12+25/0.45+(route-25)/1.0;
  return {km,min:Math.round(min),walk:route<=1.5};
}
function fmtMin(m){
  if(m<60) return `約${m}分`;
  const h=Math.floor(m/60),r=m%60;
  return r?`約${h}時間${r}分`:`約${h}時間`;
}

function haystack(e){
  const x=EXTRA[e.id]||{};
  const a=e.artist?ARTISTS[e.artist]:null, b=e.artist2?ARTISTS[e.artist2]:null;
  return [e.title,e.altTitle,e.sub,e.org,e.venue,e.area,e.addr,x.st,a&&a.name,a&&a.en,b&&b.name,b&&b.en,e.desc]

function filtered(){
  const q=state.q.trim().toLowerCase();
  const pool = state.shared ? EX.filter(e=>state.shared.has(e.id)) : EX;
  let a=pool.filter(e=>{
    const st=status(e);
    if(state.fee==="free" && !e.free) return false;
    if(state.fee==="paid" && e.free) return false;
    if(state.fee==="open" && !["now","soon","urg"].includes(st.k)) return false;
    if(state.fee==="today"){
      if(!["now","soon","urg"].includes(st.k)) return false;
      if(isClosedToday(e)) return false;
    }
    if(state.area!=="all" && e.area!==state.area) return false;
    if(state.festOnly && !e.fest) return false;
    if(state.favOnly && !state.favs.has(e.id)) return false;
    if(q && !haystack(e).includes(q)) return false;
    return true;
  });
  const rank=e=>{const k=status(e).k;return k==="end"?2:k==="pre"?1:0};
  a.sort((x,y)=>{
    const rx=rank(x),ry=rank(y);
    if(rx!==ry) return rx-ry;
    if(state.sort==="deadline") return rx===1?pd(x.start)-pd(y.start):pd(x.end)-pd(y.end);
    /* 終了が遠い順。開催中／開催前／終了 のかたまり分けはそのままに、
       かたまりの中だけ終了日の遅いほうから並べる。 */
    if(state.sort==="endfar") return rx===1?pd(y.start)-pd(x.start):pd(y.end)-pd(x.end);
    if(state.sort==="start") return pd(x.start)-pd(y.start);
    if(state.sort==="name") return x.title.localeCompare(y.title,"ja");
    if(state.sort==="near"){
      const tx=travel(x),ty=travel(y);
      return (!tx||!ty)?pd(x.end)-pd(y.end):tx.min-ty.min;
    }
    return 0;
  });
  return a;
}

function shotsHTML(e,idx){

/* 会期の日付表示。開幕前でも必ず「開幕日 – 終了日」を両方出す。

/* メーターの充填量は「残り日数」だけで決まる。

const METER_FULL_DAYS=90;
function fillPct(e,st){
  if(st.k==="end"||st.k==="pre") return 0;

function animateMeters(root){

/* 画像がまだ描ける状態になっていないと、そこへ流れ込んだ一瞬だけ黒く抜ける。
   Safari は画面外の画像のデコードを後回しにするので、カードが見えたところで
   読み込みとデコードを先に済ませておく。 */
function warmImg(im){
  if(!im) return Promise.resolve();
  im.setAttribute("loading","eager");
  im.setAttribute("decoding","sync");
  if(!im.decode) return Promise.resolve();
  return im.decode().catch(()=>{});
}
/* 保険。元画像を極小に潰したものを複製の背景に敷いておく。
   万一デコードが間に合わなくても、黒ではなく同じ絵のぼけた版が出る。 */
function blurBack(slideEl, src){
  try{
    if(!src || !src.naturalWidth || !src.naturalHeight) return;
    const cv=document.createElement("canvas");
    cv.width=24;
    cv.height=Math.max(1,Math.round(24*src.naturalHeight/src.naturalWidth));
    cv.getContext("2d").drawImage(src,0,0,cv.width,cv.height);
    slideEl.style.background=`center/cover no-repeat url(${cv.toDataURL("image/jpeg",.6)})`;
  }catch(_){}

const shotSeen = "IntersectionObserver" in window ? new IntersectionObserver((es,ob)=>{
  es.forEach(e=>{

    if(e.target.__ready) e.target.__ready();

},{rootMargin:"300px 0px"}) : null;

/* まだ用意していない画像は、置いてあることにせず最初から無かった扱いにする。
   読み込みに失敗した src をここに覚えておいて、そのコマごと外す。 */
const DEAD=new Set();
const rebuildQ=new Set();
let rebuildT=null;
function scheduleRebuild(s){
  rebuildQ.add(s);
  clearTimeout(rebuildT);
  rebuildT=setTimeout(()=>{
    const list=[...rebuildQ]; rebuildQ.clear();
    list.forEach(el=>{ if(el.isConnected) setupShots(el) });
  },120);
}

function bindShots(root){
  if(shotSeen) shotSeen.disconnect();
  root.querySelectorAll("[data-shots]").forEach(setupShots);
}

function setupShots(s){
  /* 組み直せるように、まず前回の状態をほどく。
     リスナーは signal でまとめて外すので、要素を作り直す必要はない
     （作り直すと画像が読み込み直しになってちらつく）。 */
  if(s.__ac) s.__ac.abort();
  const ac=new AbortController(), sig=ac.signal;
  s.__ac=ac;

  const strip=s.querySelector(".strip");
  const track=strip.querySelector(".track");
  if(track){
    while(track.firstChild) strip.appendChild(track.firstChild);
    track.remove();
  }
  strip.querySelectorAll(".slide.clone").forEach(c=>c.remove());
  strip.classList.remove("rail");
  strip.style.removeProperty("transform");

  /* 読み込めないと分かっている画像のコマは、ここで落とす */
  [...strip.children].forEach(sl=>{
    const im=sl.querySelector("img");
    if(im && DEAD.has(im.getAttribute("src"))) sl.remove();
  });

  const imgs=[...strip.querySelectorAll("img")];

  imgs.forEach(im=>{
    if(im.complete && im.naturalWidth===0){
      DEAD.add(im.getAttribute("src")); scheduleRebuild(s); return;

      DEAD.add(im.getAttribute("src"));

    },{signal:sig});
  });

  }

  strip.querySelectorAll(".slide.lead").forEach(el=>el.classList.remove("lead"));

       2枚目以降の load では一切再計算しないので、
       大きい写真を見たあと 1枚目に戻ってもサイズが変わらない。 */
    const first=imgs[0];
    const sizeUp=()=>{
      if(!first.naturalWidth) return;
      const raw=first.naturalHeight/first.naturalWidth;
      const ar=Math.min(raw, AR_MAX);

         余白は同じ絵のぼかしで埋める（黒帯にしない）。 */
      const tall=raw>AR_MAX+.01;
      s.classList.toggle("tall", tall);
      if(tall){
        const leads=[...strip.querySelectorAll(".slide.lead")];
        (leads.length?leads:[first.closest(".slide")]).forEach(sl=>sl&&blurBack(sl, first));
      }
      /* 出している高さが控えとずれていたら、その場で直す。
         ただし直すと下の内容が動くので、カードの上端がまだ画面の上へ

     書き換えられず、輪をつなぎ直す一瞬だけ操作を受け付けられなくなる。

  const slides=[...strip.children];

  let x=0;        /* rail の現在位置 */

  const put=(v,ms)=>{
    x=v;

    rail.style.transform  = `translate3d(${v}px,0,0)`;

    const i=((p==null?cur:p)-1+n)%n;
    dots.forEach((d,j)=>d.classList.toggle("on",j===i));

     見えている位置は変えずに番号だけ振り替えるので、継ぎ目は出ない。 */
  const unwrap=()=>{
    const w=W();

    else if(cur===0){ cur=n; put(x-n*w,0) }

  s.__ready=()=>{

       暇なときまで待たせて、スクロールの邪魔をしないようにする。 */
    const run=()=>Promise.all([warmImg(imgs[0]), warmImg(imgs[n-1])]).then(()=>{
      warmImg(cTail.querySelector("img")).then(()=>blurBack(cTail, imgs[0]));

    try{ m41=new DOMMatrixReadOnly(getComputedStyle(rail).transform).m41 }catch(_){ m41=x }
    put(m41,0);
